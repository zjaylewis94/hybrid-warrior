<meta name="theme-color" content="#0a0a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Warrior">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a08;
    --dark: #111210;
    --panel: #161714;
    --border: #2a2b27;
    --olive: #4a5240;
    --olive-light: #6b7560;
    --yellow: #f0d000;
    --yellow-dim: #c4aa00;
    --text: #d4d5ce;
    --text-dim: #787970;
    --white: #eeede8;
    --red: #c0392b;
    --green: #4a7c59;
    --blue: #2e7da3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  /* HEADER */
  .header {
    border-bottom: 2px solid var(--yellow);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--black);
    z-index: 100;
  }

  .header-left { display: flex; flex-direction: column; }

  .header-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--yellow);
    letter-spacing: 4px;
    line-height: 1;
  }

  .header-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .block-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 3px;
    color: var(--white);
  }
  .block-badge span { color: var(--yellow); }

  /* PROGRAM TAB SWITCHER */
  .program-switcher {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
    border-radius: 2px;
    margin-bottom: 0;
  }

  .prog-tab {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    padding: 8px 20px;
    background: var(--dark);
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    border-right: 1px solid var(--border);
    transition: all 0.15s;
    letter-spacing: 2px;
  }

  .prog-tab:last-child { border-right: none; }
  .prog-tab:hover { background: var(--panel); color: var(--text); }
  .prog-tab.active { background: var(--yellow); color: var(--black); }

  /* BLOCK SELECTOR */
  .block-nav {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
    border-radius: 2px;
  }

  .block-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    padding: 5px 10px;
    background: var(--dark);
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    border-right: 1px solid var(--border);
    transition: all 0.15s;
    letter-spacing: 1px;
  }

  .block-btn:last-child { border-right: none; }
  .block-btn:hover { background: var(--panel); color: var(--text); }
  .block-btn.active { background: var(--yellow); color: var(--black); font-weight: bold; }

  /* MAIN LAYOUT */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

  /* WEEK STRIP */
  .week-strip {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .day-tab {
    flex: 1;
    min-width: 120px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 3px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .day-tab:hover { border-color: var(--olive); background: var(--dark); }
  .day-tab.active { border-top-color: var(--yellow); border-color: var(--olive); background: var(--dark); }
  .day-tab.rest { opacity: 0.4; cursor: default; border-top-color: var(--border); }

  .day-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 3px; color: var(--white); }
  .day-focus { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }
  .day-tab.active .day-label { color: var(--yellow); }
  .day-tab.active .day-focus { color: var(--olive-light); }

  /* WORKOUT PANEL */
  .workout-panel { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* SECTIONS */
  .section { margin-bottom: 24px; }

  .section-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 4px;
    color: var(--olive-light);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .info-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--olive);
    padding: 12px 20px;
    font-size: 0.9rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* KB PRIME BOX */
  .kb-prime-box {
    background: rgba(240,208,0,0.06);
    border: 1px solid var(--yellow-dim);
    border-left: 4px solid var(--yellow);
    padding: 14px 20px;
    margin-bottom: 16px;
  }

  .kb-prime-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 3px;
    color: var(--yellow);
    margin-bottom: 8px;
  }

  .kb-prime-items { display: flex; flex-wrap: wrap; gap: 8px; }

  .kb-prime-item {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 4px 10px;
    background: rgba(240,208,0,0.08);
    border: 1px solid rgba(240,208,0,0.2);
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* WORKOUT TABLE */
  .workout-table { width: 100%; border-collapse: collapse; }
  .workout-table thead tr { background: var(--yellow); }
  .workout-table thead th {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 3px;
    color: var(--black);
    padding: 10px 14px;
    text-align: left;
    border-right: 1px solid rgba(0,0,0,0.15);
  }
  .workout-table thead th:last-child { border-right: none; }
  .workout-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .workout-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
  .workout-table tbody tr:hover { background: rgba(240,208,0,0.04); }
  .workout-table tbody td { padding: 10px 14px; font-size: 0.9rem; letter-spacing: 1px; border-right: 1px solid var(--border); vertical-align: middle; }
  .workout-table tbody td:last-child { border-right: none; }

  .lift-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--white); letter-spacing: 1px; }
  .lift-note { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 1px; margin-top: 2px; }
  .rest-note { font-size: 0.68rem; color: var(--yellow-dim); letter-spacing: 1px; margin-top: 3px; opacity: 0.85; }

  .acft-tag {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    padding: 2px 5px;
    background: rgba(240,208,0,0.15);
    border: 1px solid var(--yellow-dim);
    color: var(--yellow);
    letter-spacing: 1px;
    margin-top: 3px;
    border-radius: 1px;
  }

<script>
// ============================================================
// CONFIG
// ============================================================
const ORM = { deadlift: 445, squat: 450, bench: 315, ohp: 190, hangclean: 275 };

const BLOCKS = [
  { num: 1,  pct: 60 },
  { num: 2,  pct: 65 },
  { num: 3,  pct: 70 },
  { num: 4,  pct: 75 },
  { num: 5,  pct: 80 },
  { num: 6,  pct: 85 },
  { num: 7,  pct: 90 },
  { num: 8,  pct: 92 },
  { num: 9,  pct: 94 },
  { num: 10, pct: 96 },
  { num: 11, pct: 98 },
  { num: 12, pct: 100 },
];

// Strength overload: +5 lbs every 2 weeks
// SCALED DOWN (rebuild phase): base dropped from 0.75 -> 0.58 to match current
// work capacity. Form and reps first — earn the load back, then bump this up.
const HYBRID_BASE = 0.58;
function hybridLift(lift, weekNum) {
  const base = ORM[lift] || 0;
  const bonus = Math.floor((weekNum - 1) / 2) * 5;
  return Math.round((base * HYBRID_BASE + bonus) / 5) * 5;
}

// Long run mileage: +0.5 mi/week starting at 4 mi
function longRunMiles(weekNum) {
  return (4 + (weekNum - 1) * 0.5).toFixed(1);
}

// Endurance run: starts at 3 mi, +0.5/week
function enduranceMiles(weekNum) {
  return (3 + (weekNum - 1) * 0.5).toFixed(1);
}

function calcWeight(lift, pct) {
  const base = ORM[lift] || 0;
  return Math.round((base * pct / 100) / 5) * 5;
}

function pyramidSets(topWeight, sets) {
  const arr = [];
  for (let i = sets - 1; i >= 0; i--) {
    arr.push(Math.round((topWeight - i * topWeight * 0.08) / 5) * 5);
  }
  return arr.join('-');
}

let savedPosition = {};
try { savedPosition = JSON.parse(localStorage.getItem('zach-position') || '{}'); } catch(e) { savedPosition = {}; }
let currentProgram = savedPosition.program || 'hybrid';
let currentBlock = typeof savedPosition.block === 'number' ? savedPosition.block : 1;
let currentDay = savedPosition.day || 'tuesday';
function savePosition() {
  try { localStorage.setItem('zach-position', JSON.stringify({ program: currentProgram, block: currentBlock, day: currentDay })); } catch(e) {}
}
const checkedState = {};
// Actual-performed log (what you really did vs the prescription).
// Persisted to localStorage; prescriptions stay untouched.
let actualLog = {};
try { actualLog = JSON.parse(localStorage.getItem('zachActualLog') || '{}'); } catch(e) { actualLog = {}; }
function saveActual(key, el) {
  actualLog[key] = el.value;
  try { localStorage.setItem('zachActualLog', JSON.stringify(actualLog)); } catch(e) {}
}

// ============================================================
// BCT DATA
// ============================================================
function getBCTData(block) {
  const p = block.pct;
  const dl = calcWeight('deadlift', p);
  const sq = calcWeight('squat', p);
  const bp = calcWeight('bench', p);
  const ohp = calcWeight('ohp', p);
  const amrap = block.num >= 3 ? '+ AMRAP final set' : '';

  const runPrograms = [
    { title: 'INTERVAL RUN', desc: '4 x 800m', detail: '90sec rest between', note: 'Focus on form & breathing. Target pace: easy-moderate.' },
    { title: 'INTERVAL RUN', desc: '5 x 800m', detail: '75sec rest between', note: 'Push the last 2 intervals.' },
    { title: 'TEMPO RUN', desc: '20 min sustained', detail: 'Comfortably hard pace', note: 'Stay at 80% effort. No walk breaks.' },
    { title: 'TEMPO RUN', desc: '25 min sustained', detail: 'Comfortably hard pace', note: 'Build to it. Last 5 min push.' },
    { title: 'FARTLEK', desc: '30 min', detail: '1 min hard / 2 min easy', note: 'Mix terrain if possible. Simulate BCT conditions.' },
    { title: 'TEMPO RUN', desc: '30 min sustained', detail: '~85% effort', note: 'Target sub-15:30 2-mile pace.' },
    { title: 'INTERVAL RUN', desc: '6 x 800m', detail: '60sec rest between', note: 'Push pace — these should hurt. HR near max on last 2.' },
    { title: 'TEMPO RUN', desc: '35 min sustained', detail: '~87% effort', note: 'This is race prep. Hold the pace through discomfort.' },
    { title: 'FARTLEK', desc: '40 min', detail: '90sec hard / 90sec easy', note: 'Simulate uneven BCT pace demands. Stay controlled.' },
    { title: 'TEMPO RUN', desc: '40 min sustained', detail: '~90% effort', note: 'Sub-15:00 2-mile target pace. Lock in.' },
    { title: '1.5-MILE TIME TRIAL', desc: '1.5 miles — max effort', detail: 'Full send', note: 'Track your time. Rest 10 min then 1 mile easy.' },
    { title: '2-MILE TIME TRIAL', desc: 'Full 2-mile max effort', detail: 'ACFT simulation', note: 'This is your test. Leave nothing in the tank.' },
  ];

  const ltProgressions = [

// Plank progression rebuilt from a realistic baseline. Week 1 = max-hold
// (log whatever you get). Builds gradually instead of assuming a 2:00 start.
// Re-anchored after 2:06 PR (Future Soldier training). Conservative build from a
// repeatable 2:00 floor -> 3:00 by week 12.
const PLANK_TARGETS = ['2:00','2:00','2:10','2:10','2:20','2:20','2:30','2:30','2:45','2:45','3:00','3:00'];

function getPlankWork(week) {
  // Series (default) most weeks; max-hold TEST every 4th week (4,8,12).
  // Series grows time per position across the cycle.
  const isTest = (week % 4 === 0);
  if (isTest) {
    return { name: 'PLANK — MAX HOLD TEST', detail: 'Single max hold, log your time. Benchmark vs PR 2:06. Then move on.' };
  }
  const sec = week <= 3 ? '30' : (week <= 7 ? '35' : '40');
  const total = week <= 3 ? '2:00' : (week <= 7 ? '2:20' : '2:40');
  return { name: 'PLANK SERIES', detail: sec + 's each, continuous: elbow → R side → L side → high plank (hands). ' + total + ' total flow.' };
}

function getCoreEndcap(week, type) {
  // 12-week rotation from the RHS practice card. Every session hits:
  // anti-extension + POSTERIOR CHAIN + anti-rotation/lateral + a hip-opener.
  // No more all-anterior / hip-flexor-dominant core work.
  const pt = PLANK_TARGETS[week - 1];
  const plankItem = getPlankWork(week);  // series default, max-hold test wks 4/8/12
  const s = week <= 4 ? '2' : '3';

  // Rotate a named block each week so it never gets stale
  const CORE_BLOCKS = {
    LION: [
      { name: 'ALTERNATE HOLDS',     detail: s + 'x20 sec — anti-extension' },
      { name: 'HAND-KNEE TRANSFER',  detail: s + 'x8ea — anti-rotation, slow' },
      { name: 'BACK HYPERS',         detail: s + 'x12 — LOWER BACK. Squeeze at top.' },
      { name: 'JACK HAMMER',         detail: s + 'x10ea' },
      { name: 'WINDMILLS (ALL-FOURS)', detail: '1x8ea — on all fours, knees bent, cycle the leg in a windmill motion. Hip opener + low back.' },
    ],
    'BIG HORN': [
      { name: 'FEET 6" UP HOLD',     detail: s + 'x20 sec — low back pressed flat' },
      { name: 'LEG BRIDGE',          detail: s + 'x12 — POSTERIOR, 2 sec hold at top' },
      { name: 'KNEES 90 HOLD',       detail: s + 'x20 sec' },
      { name: 'ALTERNATE HYPERS',    detail: s + 'x10ea — LOWER BACK' },
      { name: 'LEG WINDMILLS',       detail: '1x8ea — hip mobility' },
    ],
    TIGER: [
      { name: 'SPIDERMANS',          detail: s + 'x8ea — anti-rotation + hip' },
      { name: 'BACK HYPERS',         detail: s + 'x12 — LOWER BACK' },
      { name: 'SIDE PLANK',          detail: s + 'x20 sec ea — LATERAL' },
      { name: 'ALT SUPERMANS',       detail: s + 'x10ea — POSTERIOR' },
      { name: 'FIRE HYDRANTS',       detail: '1x10ea — hip opener' },
    ],
    HIGHLANDER: [
      plankItem,
      { name: 'SUPERMANS',           detail: s + 'x12 — LOWER BACK, hold 2 sec' },
      { name: 'RUSSIAN TWIST',       detail: s + 'x12ea — anti-rotation' },
      { name: 'SIDE CRUNCHES',       detail: s + 'x12ea — LATERAL' },
      { name: 'WINDMILLS (ALL-FOURS)', detail: '1x8ea — on all fours, cycle the leg, windmill motion. Hip opener.' },
    ],
  };
  const ORDER = ['HIGHLANDER','LION','TIGER','BIG HORN'];
  const blockName = ORDER[(week - 1) % 4];
  let items = CORE_BLOCKS[blockName].slice();

  // Always anchor the plank progression somewhere in the session
  const hasPlank = items.some(function(x){ return /PLANK|HOLD/.test(x.name); });  // series/test both match
  if (!hasPlank) items.unshift(plankItem);

  // Hyrox day is post-AMRAP — cut it down, you're already cooked
  if (type === 'hyrox') {
    items = items.slice(0, 3);
    items[0] = plankItem;  // plank series/test even on hyrox day
  }
  items.blockName = blockName;
  return items;
}

function getSpeedLadder(w) {
  // 3 blocks, sliding by 100, deload each block's final week
  const ladders = {
    1:  ['100','200','100'],
    2:  ['100','200','200','100'],
    3:  ['100','200','300','200','100'],
    4:  ['100','200','100'],                        // deload
    5:  ['100','200','300','200','100'],
    6:  ['200','300','400','300','200'],
    7:  ['200','300','400','300','200'],
    8:  ['100','200','300','200','100'],            // deload
    9:  ['200','300','400','500','400','300','200'],
    10: ['200','300','400','500','400','300','200'],
    11: ['200','300','400','300','200'],            // deload
    12: ['300','400','500','600','500','400','300'], // peak
  };
  const rungs = ladders[w];
  const peak = Math.max.apply(null, rungs.map(Number));
  const deload = (w === 4 || w === 8 || w === 11);
  const block = w <= 4 ? 1 : (w <= 8 ? 2 : 3);
  const steps = [];
  steps.push('Recover 5 min after AMRAP, hydrate');
  rungs.forEach(function(r, i) {
    const last = i === rungs.length - 1;
    steps.push(r + 'm hard' + (last ? '  →  done' : '  →  2 min rest'));
  });
  steps.push('Curved/self-powered belt: chase effort, not the pace number');
  return {
    title: 'TREADMILL SPEED LADDER — BLOCK ' + block + (deload ? ' (DELOAD)' : '') + ' — PEAK ' + peak + 'm',
    steps: steps,
  };
}

function renderBlockNav() {

  nav.innerHTML = BLOCKS.map((b, i) =>
    '<button class="block-btn ' + (i === currentBlock ? 'active' : '') + '" onclick="setBlock(' + i + ')">' + b.num + '</button>'
  ).join('');
}

function updateProgressCards() {
  const b = BLOCKS[currentBlock];
  document.getElementById('block-display').textContent = b.num;
  document.getElementById('pct-display').textContent = currentProgram === 'bct' ? b.pct + '%' : 'WK' + b.num;
  document.getElementById('progress-val').innerHTML = 'BLOCK ' + b.num + ' <span>/ 12</span>';
  document.getElementById('progress-bar').style.width = ((currentBlock + 1) / 12 * 100) + '%';
  if (currentProgram === 'bct') {
    document.getElementById('intensity-val').innerHTML = b.pct + ' <span>%</span>';
    document.getElementById('intensity-bar').style.width = b.pct + '%';
    document.getElementById('prog-card-3-val').innerHTML = '2MI <span>RUN</span>';
  } else {
    const bonus = Math.floor(currentBlock / 2) * 5;
    document.getElementById('intensity-val').innerHTML = '+' + bonus + ' <span>LBS</span>';
    document.getElementById('intensity-bar').style.width = (currentBlock / 7 * 100) + '%';
    document.getElementById('prog-card-3-val').innerHTML = longRunMiles(b.num) + ' <span>MI</span>';
  }
}

function setProgram(prog) {
  currentProgram = prog;
  currentDay = 'monday';
  document.querySelectorAll('.prog-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('header-sub').textContent = prog === 'bct'
    ? '// BODYBUILDING + PROGRAM — 12-WEEK CYCLE'
    : '// HYBRID WARRIOR PROGRAM — 12-WEEK CYCLE';
  updateProgressCards();
  renderWorkout();
  savePosition();
}

  currentBlock = i;
  renderBlockNav();
  updateProgressCards();

  savePosition();
}

function toggleCheck(key) {
  checkedState[key] = !checkedState[key];
  const el = document.getElementById('check-' + key);
  if (el) {
    el.classList.toggle('checked', checkedState[key]);
    el.textContent = checkedState[key] ? '✓' : '';
  }
}

};

function restFor(l) {
  if (l.ss) {
    return l.ssPos === 'first'
      ? 'NO REST → STRAIGHT INTO PAIRED MOVE'
      : 'REST 90 SEC AFTER THE PAIR, REPEAT';
  }
  return REST_LOOKUP[l.name] || REST_DEFAULT;
}

function renderLiftTable(lifts, prefix, tagFn) {
  let h = '<table class="workout-table"><thead><tr><th>LIFT</th><th>LBS</th><th>SETS</th><th>REPS</th><th style="text-align:center">DONE</th></tr></thead><tbody>';
  lifts.forEach(function(l, i) {
    const key = prefix + '-' + i;
    // Superset grouping classes
    let cls = '';
    if (l.ss) {
      cls = 'ss-row';
      if (l.ssPos === 'first') cls += ' ss-first';
      if (l.ssPos === 'last')  cls += ' ss-last';
    }
    h += '<tr class="' + cls + '"><td>'
      + (l.ss && l.ssPos === 'first' ? '<div class="ss-badge">⇄ SUPERSET ' + l.ss + '</div>' : '')
      + '<div class="lift-name">' + l.name + '</div>'
      + (l.note ? '<div class="lift-note">' + l.note + '</div>' : '')
      + '<div class="rest-note">⏱ REST: ' + restFor(l) + '</div>'
      + (l.acft ? '<div class="acft-tag">ACFT RELEVANT</div>' : '')
      + (l.hybrid ? '<div class="hybrid-tag">HYBRID FOCUS</div>' : '')
      + '</td>'
      + '<td><span class="pct-badge">' + l.lbs + '</span>'
      + '<input class="actual-input" placeholder="—" value="' + (actualLog[key + '-lbs'] || actualLog[key] || '') + '" oninput="saveActual(\'' + key + '-lbs\', this)"></td>'
      + '<td><span class="sets-reps">' + l.sets + '</span>'
      + '<input class="actual-input" placeholder="—" value="' + (actualLog[key + '-sets'] || '') + '" oninput="saveActual(\'' + key + '-sets\', this)"></td>'
      + '<td><span class="sets-reps">' + l.reps + '</span>'
      + '<input class="actual-input" placeholder="—" value="' + (actualLog[key + '-reps'] || '') + '" oninput="saveActual(\'' + key + '-reps\', this)"></td>'
      + '<td style="text-align:center"><div class="done-check ' + (checkedState[key] ? 'checked' : '') + '" id="check-' + key + '" onclick="toggleCheck(\'' + key + '\')">' + (checkedState[key] ? '✓' : '') + '</div></td>'
      + '</tr>';
  });
  h += '</tbody></table>';
  return h;
}

function renderNotes(key) {

    + '<textarea class="notes-area" placeholder="ADD SESSION NOTES..." id="notes-' + key + '"></textarea></div>';

function attachNotes(key) {
  const ta = document.getElementById('notes-' + key);
  if (!ta) return;
  try { ta.value = localStorage.getItem('notes-' + key) || ''; } catch(e) {}
  ta.addEventListener('input', function() {
    try { localStorage.setItem('notes-' + key, ta.value); } catch(e) {}
  });
}

      + '</div></div></div>';

    html += '<div class="section"><div class="section-label">// acft — leg tuck progression</div>'
      + '<div class="lt-tracker"><div class="lt-tracker-title">BLOCK ' + BLOCKS[currentBlock].num + ' LEG TUCK WORK</div>'
      + '<div class="lt-sets">'
      + day.lt.map(function(s, i) {
          const key = 'lt-' + currentBlock + '-' + i;
          return '<div class="lt-set"><div class="lt-set-label">' + (i+1) + '. ' + s.label + '</div>'
            + '<div style="display:flex;gap:16px;align-items:center;">'
            + '<div class="lt-set-detail">' + s.sets + ' sets × ' + s.detail + '</div>'
            + '<div class="done-check ' + (checkedState[key] ? 'checked' : '') + '" id="check-' + key + '" onclick="toggleCheck(\'' + key + '\')">' + (checkedState[key] ? '✓' : '') + '</div>'

  }

  if (day.lifts) {
    html += '<div class="section"><div class="section-label">// workout</div>' + renderLiftTable(day.lifts, prefix, null) + '</div>';
  }

  html += renderCooldown(day.cooldown);
  html += renderNotes(prefix);

  content.innerHTML = html;
  attachNotes(prefix);
}

    html += '<div class="info-box">ACTIVE RECOVERY DAY — NO LIFTING.</div></div>';
    html += '<div class="section"><div class="section-label">// recommended activities</div>';
    html += '<div class="cooldown-items">' + day.recovery.map(r => '<div class="cooldown-item">' + r + '</div>').join('') + '</div></div>';
    html += renderCoreBlock(day.core, prefix, 'core circuit + acft plank — target: ' + PLANK_TARGETS[wk - 1]);
    html += renderNotes(prefix);
    content.innerHTML = html;
    attachNotes(prefix);
    return;
  }

  // SATURDAY LONG RUN
  if (day.longRun) {
    let html = '<div class="section"><div class="section-label">// saturday — pick ONE: long run or ruck</div>';
    // OPTION A — LONG RUN
    html += '<div class="run-card"><div class="run-card-title">OPTION A — LONG RUN (WK ' + wk + ')</div>'
      + '<div class="run-intervals">'
      + '<div class="run-interval"><div class="run-interval-num" style="font-size:1.8rem;color:var(--yellow);">' + day.longRun.miles + '</div><div class="run-interval-desc">MILES — EASY AEROBIC PACE</div><div class="run-interval-detail">HR &lt; 155 BPM</div></div>'
      + '<div class="run-interval" style="border-left:2px solid var(--yellow);padding-left:10px;"><div class="run-interval-num" style="color:var(--olive-light)">📋</div><div class="run-interval-desc" style="color:var(--text-dim);font-style:italic;">' + day.longRun.note + '</div></div>'
      + '</div></div>';
    // OPTION B — RUCK
    if (day.ruck) {
      html += '<div class="run-card" style="border-left-color:var(--olive-light);margin-top:12px;">'
        + '<div class="run-card-title" style="color:var(--olive-light);">OPTION B — RUCK (WK ' + wk + ')</div>'
        + '<div class="run-intervals">'
        + '<div class="run-interval"><div class="run-interval-num" style="font-size:1.4rem;color:var(--olive-light);">' + day.ruck.wt + '</div><div class="run-interval-desc">RUCK WEIGHT — loaded backpack is fine</div></div>'
        + '<div class="run-interval"><div class="run-interval-num" style="font-size:1.4rem;color:var(--olive-light);">' + day.ruck.dist + '</div><div class="run-interval-desc">DISTANCE</div><div class="run-interval-detail">' + day.ruck.pace + '</div></div>'
        + '<div class="run-interval" style="border-left:2px solid var(--olive-light);padding-left:10px;"><div class="run-interval-num" style="color:var(--olive-light)">📋</div><div class="run-interval-desc" style="color:var(--text-dim);font-style:italic;">Walk the whole thing — do NOT run with the weight. Boots or sturdy shoes. Pack the load HIGH and tight against your back, not sagging low. If your feet or lower back start screaming, cut it short — rucking injuries are cumulative.</div></div>'
        + '</div></div>';
    }
    html += '</div>';
    html += '<div class="section"><div class="section-label">// 12-week long run progression</div><div class="mileage-grid">';
    for (let i = 1; i <= 12; i++) {
      const isCurrent = i === wk;
      html += '<div class="mile-card ' + (isCurrent ? 'current' : '') + '">'
        + '<div class="mile-card-week">WK ' + i + '</div>'
        + '<div class="mile-card-dist">' + longRunMiles(i) + '<span>mi</span></div>'
        + '</div>';
    }
    html += '</div></div>';
    // Ruck progression grid
    html += '<div class="section"><div class="section-label">// 12-week ruck progression</div><div class="mileage-grid">';
    for (let i = 1; i <= 12; i++) {
      const isCurrent = i === wk;
      const r = getRuck(i);
      html += '<div class="mile-card ' + (isCurrent ? 'current' : '') + '">'
        + '<div class="mile-card-week">WK ' + i + '</div>'
        + '<div class="mile-card-dist" style="font-size:0.85rem;">' + r.wt.replace(' lbs','') + '<span>lb</span></div>'
        + '<div class="mile-card-week" style="margin-top:2px;">' + r.dist.replace(' miles','mi').replace(' mile','mi') + '</div>'
        + '</div>';
    }
    html += '</div></div>';
    html += renderCooldown(day.cooldown);
    html += renderNotes(prefix);
    content.innerHTML = html;
    attachNotes(prefix);
    return;
  }

  // STANDARD DAY — split into GYM (lift) and HOME (cardio) blocks
  let html = '';

  // Build the cardio content (run/speed/ladder) for the HOME block
  let cardioHtml = '';
  if (typeof day.amRun === 'string') {
    cardioHtml += '<div class="section"><div class="section-label">// easy cardio</div><div class="info-box">🏃 ' + day.amRun.toUpperCase() + '</div></div>';
  } else if (day.amRun && day.amRun.title) {
    cardioHtml += '<div class="section"><div class="section-label">// ' + day.amRun.title.toLowerCase() + '</div>'
      + '<div class="run-card"><div class="run-card-title">' + day.amRun.title + '</div><div class="run-intervals">'
      + day.amRun.steps.map(function(s, i) {
          return '<div class="run-interval"><div class="run-interval-num">0' + (i+1) + '</div><div class="run-interval-desc">' + s + '</div></div>';
        }).join('')
      + '</div></div></div>';
  }
  // Thursday treadmill ladder is cardio (comes after the AMRAP/lift)
  if (day.speedWork) {
    cardioHtml += '<div class="section"><div class="section-label">// ' + day.speedWork.title.toLowerCase() + '</div>'
      + '<div class="run-card"><div class="run-card-title">' + day.speedWork.title + '</div><div class="run-intervals">'
      + day.speedWork.steps.map(function(s, i) {
          return '<div class="run-interval"><div class="run-interval-num">0' + (i+1) + '</div><div class="run-interval-desc">' + s + '</div></div>';
        }).join('')
      + '</div></div></div>';
  }

  // ── GYM — LIFT block ──
  let gymHtml = '';
  if (day.kneeNote) {
    gymHtml += '<div class="section"><div class="kb-prime-box" style="border-left-color:var(--red);background:rgba(192,57,43,0.08);">'
      + '<div class="kb-prime-title" style="color:var(--red);">⚠ KNEE — READ FIRST</div>'
      + '<div style="font-size:0.8rem;color:var(--text);letter-spacing:0.5px;line-height:1.5;">' + day.kneeNote + '</div>'
      + '</div></div>';
  }
  // Gym warm-up placeholder (you handle your own — stretch at minimum)
  gymHtml += renderGymWarmup();
  if (day.hyrox) {
    gymHtml += '<div class="section"><div class="section-label">// hyrox matrix — 25-minute amrap (this IS your lift)</div>'
      + '<div class="hyrox-card"><div class="hyrox-title">' + day.hyrox.title + '</div>'
      + '<div class="hyrox-sub">' + day.hyrox.format + '</div>'
      + '<div class="lt-sets">'
      + day.hyrox.moves.map(function(m, i) {
          const key = prefix + '-hyrox-' + i;
          return '<div class="lt-set"><div class="lt-set-label">' + m.label + '</div>'
            + '<div style="display:flex;gap:16px;align-items:center;">'
            + '<div class="lt-set-detail">' + m.detail + '</div>'
            + '<input class="actual-input" placeholder="—" value="' + (actualLog[key] || '') + '" oninput="saveActual(\'' + key + '\', this)">'
            + '<div class="done-check ' + (checkedState[key] ? 'checked' : '') + '" id="check-' + key + '" onclick="toggleCheck(\'' + key + '\')">' + (checkedState[key] ? '✓' : '') + '</div>'
            + '</div></div>';
        }).join('')
      + '</div>'
      + '<div style="margin-top:10px;font-family:Share Tech Mono,monospace;font-size:0.7rem;color:var(--text-dim);letter-spacing:1px;">📋 ' + day.hyrox.note + '</div>'
      + '</div></div>';
  }
  if (day.lifts) {
    gymHtml += '<div class="section"><div class="section-label">// lift</div>' + renderLiftTable(day.lifts, prefix, null) + '</div>';
  }
  // Core end-cap stays with the lift day
  if (day.core) {
    gymHtml += renderCoreBlock(day.core, prefix, 'core end-cap: ' + (day.core.blockName || '') + ' — plank: ' + PLANK_TARGETS[wk - 1]);
  }

  // KB home circuit goes in the HOME block (standalone conditioning)
  cardioHtml += renderKBCircuit(wk, prefix);

  // Assemble the two blocks
  html += '<div class="day-block gym"><div class="day-block-header">🏋 GYM — LIFT<span class="sub">lift · core · hyrox</span></div><div class="day-block-body">' + gymHtml + '</div></div>';
  html += '<div class="day-block home"><div class="day-block-header">🏃 HOME — CARDIO + KB<span class="sub">runs · KB · your schedule</span></div><div class="day-block-body">' + cardioHtml + '</div></div>';

  html += renderCooldown(day.cooldown);
  html += renderNotes(prefix);

  content.innerHTML = html;
  attachNotes(prefix);
}

// ============================================================
// MAIN RENDER
// ============================================================
function renderWorkout() {
  renderDayTabs();
  if (currentProgram === 'bct') {
    renderBCTWorkout();
  } else {
    renderHybridWorkout();
  }
}

// Footer date
document.getElementById('footer-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' }).toUpperCase();

// Init
renderBlockNav();
updateProgressCards();
renderWorkout();
</script>
</body>
</html>
