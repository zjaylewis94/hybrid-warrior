        + rgrList([{ name: 'WEIGHT (LB)', detail: 'trend, not one day' }, { name: 'WAIST (IN)', detail: 'at the belly button' },
                   { name: 'FEET / KNEES (1-10)', detail: 'anything nagging?' }], prefix, 'checkin', 'WEEK ' + w + ' CHECK-IN') + '</div>';
      html += rgrCheckinHistory();
    }
    html += renderNotes(prefix);
    content.innerHTML = html;
    attachNotes(prefix);
    return;
  }

  const runHtml = day.run ? '<div class="section"><div class="section-label">// ' + day.run.title.toLowerCase() + '</div>' + rgrRunCard(day.run, ip) + '</div>' : '';
  const fuelHtml = day.fuel ? '<details class="rgr-numbers rgr-fuel"><summary>// FUEL + HYDRATE — read before you run</summary>'
      + '<div style="padding:0 12px 4px">' + rgrList(day.fuel, ip, 'fuel', 'BEFORE · DURING · AFTER', true) + '</div>'
      + '<div class="rgr-num-foot">' + RGR_CRAMP + '</div></details>' : '';
  if (day.runFirst) html += fuelHtml + runHtml;
  if (day.lifts) {
    if (!day.runFirst) html += renderGymWarmup();
    html += '<div class="section"><div class="section-label">// ' + (day.liftLabel || 'lift — short and compound') + '</div>' + renderLiftTable(day.lifts, ip, null) + '</div>';
  }
  (day.circuits || []).forEach(function(c, ci) {
    html += '<div class="section"><div class="section-label">// ' + c.label + '</div>' + rgrList(c.items, ip, 'c' + ci, c.title)
      + '<div class="rgr-num-foot">' + c.note + '</div></div>';
  });
  if (day.circuit) {
    html += '<div class="section"><div class="section-label">// hotel room — no gym needed</div>' + rgrList(day.circuit.items, prefix, 'hotel', day.circuit.title)
      + '<div class="rgr-num-foot">' + day.circuit.note + '</div></div>';
  }
  if (day.sdc) {
    html += '<div class="section"><div class="section-label">// sprint-drag-carry — aft event 3</div>'
      + rgrList(day.sdc.items, ip, 'sdc', day.sdc.title)
      + '<div class="rgr-num-foot">' + day.sdc.note + '</div></div>';
  }
  if (day.combat) {
    html += '<div class="section"><div class="section-label">// combat fitness circuit — the ranger school event</div>'
      + rgrList(RGR_CIRCUIT, prefix, 'cfa', day.combat.title)
      + '<div class="rgr-num-foot">' + day.combat.note + '</div></div>';
  }
  if (!day.runFirst) html += fuelHtml + runHtml;
  if (day.core && day.v2) html += '<div class="section"><div class="section-label">// ' + (currentDay === 'tuesday' ? 'grease the groove' : 'the long plank') + '</div>' + rgrList(day.core, ip, 'core', currentDay === 'tuesday' ? 'PULL-UPS · PUSH-UPS' : 'PLANK — AFT FORM') + '</div>';
  else if (day.core) html += '<div class="section"><div class="section-label">// ' + (currentDay === 'thursday' ? 'plank + grease the groove' : 'plank + core') + '</div>' + rgrList(day.core, prefix, 'core', currentDay === 'thursday' && w <= 2 ? 'CHIN-UPS · PUSH-UPS · CORE' : currentDay === 'thursday' ? 'PLANK · PUSH-UPS · PULL-UPS' : 'PLANK + CORE — 10 MIN') + '</div>';
  if (day.grid) {
    html += '<div class="section"><div class="section-label">// saturdays — ruck cap 40 lb / 10 mi until bct</div><div class="mileage-grid">';
    RGR_SAT.slice(4).forEach(function(r, i) {   // this plan's weeks 1–11
      html += '<div class="mile-card' + (i + 5 === w ? ' current' : '') + '"><div class="mile-card-week">WK ' + (i + 1) + '</div>'
        + (r.off ? '<div class="mile-card-dist">OFF</div><div class="mile-card-week" style="margin-top:2px;">SHIP</div>'
          : r.aft ? '<div class="mile-card-dist">AFT</div><div class="mile-card-week" style="margin-top:2px;">MOCK</div>'
          : '<div class="mile-card-dist">' + r.mi + '<span>mi</span></div><div class="mile-card-week" style="margin-top:2px;">' + (r.ruck ? r.lbs + ' LB' : 'RUN') + '</div>') + '</div>';
    });
    html += '</div></div>';
  }
  if (day.pm) html += '<div class="section"><div class="section-label">// note</div><div class="info-box">🕒 ' + day.pm.toUpperCase() + '</div></div>';
  html += renderNotes(prefix);
  content.innerHTML = html;
  attachNotes(prefix);
}

// ============================================================
// OPERATOR — 12 WEEKS (added Nov 4, 2026; meant for after BCT)
// ============================================================
// Heavy strength, power and tactical conditioning. Every load comes from OPERATOR MAXES (`zach-op`), so after BCT
// Zach types his new maxes and the whole plan recalculates. The start date lives there too; until it's set, the plan
// opens on Week 1 and doesn't track today's week.
// Main lifts work off a training max (90% of the 1RM) in three 4-week waves: fives, triples, then doubles and singles.
// Weeks 4 and 8 deload; week 12 tests new maxes. The week: Mon lower · Tue upper · Wed engine (VO2 work) ·
// Thu hinge + carry · Fri press + tactical circuit · Sat ruck or long run · Sun off.
// Run paces come from the 2-mile in Ship Prep's YOUR NUMBERS (`rgr-numbers`), so there's one place to log it.
const OP_WAVES = [   // [reps, sets, % of training max]
  [5, 3, 70], [5, 4, 75], [5, 5, 80], [5, 3, 60],
  [3, 4, 80], [3, 5, 85], [3, 4, 90], [3, 3, 60],
  [2, 5, 88], [2, 4, 92], [1, 3, 95], [0, 0, 0],
];
const OP_WEEKS = [
  { type: 'BUILD',  tag: 'WAVE 1 — FIVES',    note: 'Leave 2 reps in the tank on every set. The weight climbs every week; your form doesn\'t change.' },
  { type: 'BUILD',  tag: 'WAVE 1 — FIVES',    note: 'Same lifts, one more set.' },
  { type: 'BUILD',  tag: 'WAVE 1 — PEAK',     note: 'Heaviest fives. The last set is hard but clean.' },
  { type: 'DELOAD', tag: 'DELOAD',            note: 'Lighter and shorter, same movements. Sleep and eat — this is where the last three weeks turn into strength.' },
  { type: 'BUILD',  tag: 'WAVE 2 — TRIPLES',  note: 'Heavier bar, fewer reps. Take the full rest.' },
  { type: 'BUILD',  tag: 'WAVE 2 — TRIPLES',  note: 'One more set.' },
  { type: 'BUILD',  tag: 'WAVE 2 — PEAK',     note: 'Watch bar speed: if a rep grinds, that\'s your last set.' },
  { type: 'DELOAD', tag: 'DELOAD',            note: 'Back off before the heavy wave.' },
  { type: 'BUILD',  tag: 'WAVE 3 — DOUBLES',  note: 'Low reps, full rest. Every jump and throw is max effort — power is speed, not fatigue.' },
  { type: 'BUILD',  tag: 'WAVE 3 — DOUBLES',  note: 'Heavy doubles. Circuits stay hard; lifts stay crisp.' },
  { type: 'BUILD',  tag: 'WAVE 3 — SINGLES',  note: 'Singles at 95% of the training max — heavy, not a max. Then rest up for the test.' },
  { type: 'TEST',   tag: 'TEST WEEK',         note: 'New 1RMs: squat Mon, bench Tue, deadlift Thu, press Fri. Log them in OPERATOR MAXES and the next cycle starts from them.' },
];
const OP_FIELDS = [
  { k: 'squat',    label: 'BACK SQUAT 1RM',     ph: '450' },
  { k: 'bench',    label: 'BENCH PRESS 1RM',    ph: '315' },
  { k: 'deadlift', label: 'TRAP BAR DEADLIFT 1RM', ph: '445' },
  { k: 'press',    label: 'STANDING PRESS 1RM', ph: '190' },
  { k: 'clean',    label: 'HANG POWER CLEAN 1RM', ph: '275' },
];
const OP_DEFAULT = { squat: ORM.squat, bench: ORM.bench, deadlift: ORM.deadlift, press: ORM.ohp, clean: ORM.hangclean };
function opMax(k) { const n = parseInt(opCfg[k], 10); return n > 0 ? n : OP_DEFAULT[k]; }
function opLoad(k, pct) { return String(Math.round(opMax(k) * 0.9 * pct / 100 / 5) * 5); }
function saveOpCfg(k, el) {
  opCfg[k] = el.value.trim();
  try { localStorage.setItem('zach-op', JSON.stringify(opCfg)); } catch(e) {}
  if (/^(start|fmStart|hwStart)$/.test(k)) { const p = todayPosition(); currentBlock = p.block; renderBlockNav(); }
  updateProgressCards();
  renderWorkout();
  savePosition();
}

function opMain(name, k, w, cue) {
  const v = OP_WAVES[w - 1];
  if (w === 12) return { name: name + ' — TEST', note: 'Ramp: 50%×5, 70%×3, 80%×2, 90%×1, then singles in 5–10 lb jumps. Stop when one slows down a lot. Log the best in OPERATOR MAXES.', sets: '1', reps: '1RM', lbs: 'WORK UP', rest: '3-5 MIN' };
  return { name: name, note: 'Warm-up: bar ×10, 50%×5, 65%×3, then work sets. ' + cue, sets: String(v[1]), reps: String(v[0]), lbs: opLoad(k, v[2]), rest: v[0] <= 3 ? '3 MIN' : '2-3 MIN' };
}
function opPower(w) { const d = OP_WEEKS[w - 1].type === 'DELOAD'; return d ? ['2', '3'] : w <= 4 ? ['3', '5'] : w <= 8 ? ['4', '3'] : w === 12 ? ['3', '2'] : ['5', '2']; }
function opAcc(w) { const d = OP_WEEKS[w - 1].type === 'DELOAD'; return d ? ['2', '8'] : w <= 4 ? ['3', '10'] : w <= 8 ? ['3', '8'] : ['3', '6']; }
function opRounds(w) { const t = OP_WEEKS[w - 1].type; return t === 'DELOAD' ? 2 : t === 'TEST' ? 0 : w <= 3 ? 3 : w <= 7 ? 4 : 5; }

// Wednesday engine: VO2 work (paces from the 2-mile), easy in deloads, a 2-mile in test week
const OP_ENGINE = [
  { reps: 6,  m: 400,  label: '400m',  rest: '90 sec jog' },
  { time: '5 x 3 MIN HARD / 2 MIN EASY' },
  { time: '4 x 4 MIN HARD / 3 MIN EASY', note: 'The VO2 max classic. Hard = you can say two words, not a sentence.' },
  { easy: 30 },
  { reps: 8,  m: 400,  label: '400m',  rest: '75 sec jog' },
  { reps: 5,  m: 1000, label: '1000m', rest: '2:30 jog' },
  { time: '5 x 4 MIN HARD / 3 MIN EASY' },
  { easy: 30 },
  { reps: 10, m: 200,  label: '200m',  rest: '200m jog', fast: 4, note: 'Faster than 2-mile pace. Sharp, relaxed shoulders.' },
  { reps: 3,  m: 1609, label: '1 mile', rest: '3 min jog' },
  { reps: 6,  m: 400,  label: '400m',  rest: '2 min jog', fast: 2 },
  { test: true },
];
// Friday tactical circuits, in turn
const OP_CIRCUITS = [
  { name: 'SANDBAG SPRINTS', rest: '90 SEC', rows: [['100M SPRINT', 'all out'], ['SANDBAG CLEAN TO SHOULDER', '10 · 60–80 lb, alternate shoulders (no bag: DB clean)'], ['BURPEES', '10']] },
  { name: 'CARRY MEDLEY', rest: '2 MIN', rows: [['FARMER CARRY', '50m · heavy, 2x70+'], ['SANDBAG BEAR HUG CARRY', '50m'], ['SLED DRAG, BACKWARD', '50m'], ['KB OVERHEAD CARRY', '25m ea arm']] },
  { name: 'RUN-LIFT CHIPPER', rest: 'NONE — FOR TIME', rows: [['400M RUN', 'hard'], ['KB SWINGS', '30'], ['PUSH-UPS', '20'], ['PULL-UPS', '10']] },
];
// Saturday: ruck (15:00/mi or faster) or long easy run. Never add weight AND distance in the same week.
const OP_SAT = [
  { ruck: 35, mi: 4 }, { mi: 5 }, { ruck: 35, mi: 6 }, { mi: 4 },
  { ruck: 45, mi: 6 }, { mi: 6 }, { ruck: 45, mi: 8 }, { ruck: 35, mi: 4 },
  { ruck: 50, mi: 6 }, { mi: 7 }, { ruck: 50, mi: 8 }, { mi: 5 },
];

function getOpData(w) {
  const wk = OP_WEEKS[w - 1], deload = wk.type === 'DELOAD', test = wk.type === 'TEST';
  const pw = opPower(w), acc = opAcc(w), r = opRounds(w);
  const pu = rgrPct('chins', 0.5, '5');
  const d = {};
  d.monday = { day: 'MONDAY', focus: test ? 'TEST — SQUAT' : 'LOWER — STRENGTH', time: '~60 MIN',
    lifts: [
      { name: 'BOX JUMP', note: 'Before the squat, fresh. Highest box you land quietly; step down.', sets: pw[0], reps: pw[1], lbs: 'BW', rest: '60-90 SEC' },
      opMain('BACK SQUAT', 'squat', w, 'Below parallel, brace before every rep.'),
      { name: 'ROMANIAN DEADLIFT', note: 'Hamstrings, not lower back. Bar slides down the thighs.', sets: test ? '2' : acc[0], reps: acc[1], lbs: 'RPE 7' },
      { name: 'DB WALKING LUNGE', note: '', sets: test ? '2' : acc[0], reps: acc[1] + ' ea', lbs: 'DBs' },
    ],
    core: [{ name: 'AB WHEEL', detail: '3 x 10' }, { name: 'SIDE PLANK', detail: '2 x 45 sec ea' }] };
  d.tuesday = { day: 'TUESDAY', focus: test ? 'TEST — BENCH' : 'UPPER — STRENGTH', time: '~60 MIN',
    lifts: [
      { name: 'MED BALL CHEST PASS', note: 'Into a wall, as hard as you can. No ball: plyo push-ups.', sets: pw[0], reps: pw[1], lbs: '10-20', rest: '60 SEC' },
      opMain('BENCH PRESS', 'bench', w, 'Shoulder blades pinned, feet driving.'),
      { name: 'WEIGHTED PULL-UPS', note: 'Dead hang. Add 5 lb when every rep is clean.', sets: acc[0], reps: w <= 4 ? '5' : '3', lbs: 'BW+' },
      { name: 'ONE-ARM DB ROW', note: '', sets: acc[0], reps: acc[1] + ' ea', lbs: 'RPE 7' },
      { name: 'DIPS', ss: 'O', ssPos: 'first', note: '', sets: acc[0], reps: acc[1], lbs: 'BW' },
      { name: 'FACE PULLS', ss: 'O', ssPos: 'last', note: 'Shoulder health for the pressing and the ruck.', sets: acc[0], reps: '15', lbs: 'Light' },
    ] };
  const e = OP_ENGINE[w - 1];
  let run;
  if (e.test) run = { title: '2-MILE TIME TRIAL', steps: ['10 min easy + drills + 3 x 20 sec strides', '2 MILES all-out but even. Log it in Ship Prep\'s YOUR NUMBERS — every pace comes from it.', '10 min walk/jog cool-down'] };
  else if (e.easy) run = { title: 'EASY RUN — ' + e.easy + ' MIN', steps: [e.easy + ' min easy. ' + rgrEasy(), 'Deload — no intervals this week.'] };
  else if (e.time) run = { title: e.time, steps: ['10 min easy + drills + 3 x 20 sec strides', e.time.toLowerCase() + ' — hard = about 5K race effort', e.note || 'Even efforts: the last rep looks like the first.', '10 min easy cool-down'] };
  else run = { title: 'INTERVALS — ' + e.reps + ' x ' + e.label, steps: ['10 min easy + drills + 3 x 20 sec strides', e.reps + ' x ' + e.label + ' ' + rgrRepPace(e.m, e.fast) + ' — rest ' + e.rest].concat(e.note ? [e.note] : []).concat(['10 min easy cool-down']) };
  d.wednesday = { day: 'WEDNESDAY', focus: 'ENGINE', time: '~45 MIN', run: run,
    core: [{ name: 'PLANK', detail: '3 x 1:00' }, { name: 'HANGING KNEE RAISES', detail: '3 x 12' }] };
  d.thursday = { day: 'THURSDAY', focus: test ? 'TEST — DEADLIFT' : 'HINGE + CARRY', time: '~60 MIN',
    lifts: [
      { name: 'HANG POWER CLEAN', note: 'Explosive hips, fast elbows. Speed first — if it slows, stay at that weight.', sets: pw[0], reps: pw[1], lbs: String(Math.round(opMax('clean') * (deload ? 0.55 : w <= 4 ? 0.65 : w <= 8 ? 0.7 : 0.75) / 5) * 5), rest: '90 SEC' },
      opMain('TRAP BAR DEADLIFT', 'deadlift', w, 'Push the floor away; lock out with the glutes.'),
      { name: 'FRONT SQUAT', note: 'Upright torso. Second squat of the week, lighter.', sets: test ? '2' : acc[0], reps: acc[1] === '10' ? '6' : '5', lbs: 'RPE 7' },
      { name: 'FARMER CARRY', note: 'Heavy. Grip, traps and everything that carries a ruck.', sets: '4', reps: '50m', lbs: '2x70+', rest: '90 SEC' },
      { name: 'SLED PUSH', note: '', sets: '4', reps: '25m', lbs: 'HEAVY', rest: '90 SEC' },
    ] };
  const c = OP_CIRCUITS[(w - 1) % 3];
  d.friday = { day: 'FRIDAY', focus: test ? 'TEST — PRESS' : 'PRESS + TACTICAL', time: test ? '~40 MIN' : '~60 MIN',
    lifts: [
      opMain('STANDING PRESS', 'press', w, 'Strict: glutes tight, no leg drive.'),
      { name: 'WEIGHTED CHIN-UPS', note: '', sets: acc[0], reps: pu, lbs: 'BW+' },
    ],
    circuits: r ? [{ label: 'tactical circuit — ' + c.name.toLowerCase(), title: r + ' ROUNDS · REST ' + c.rest, items: rmxItems(c.rows),
      note: c.rest.indexOf('TIME') >= 0 ? 'Log the total time. Next time, beat it.' : 'Rest only after the round. Log your times.' }] : [],
    pm: test ? 'Test day — no circuit. Press, chin-ups, done.' : null };
  const s = OP_SAT[w - 1];
  d.saturday = s.ruck
    ? { day: 'SATURDAY', focus: 'RUCK', time: '~' + Math.round(s.mi * 15 + 10) + ' MIN',
        run: { title: 'RUCK — ' + s.ruck + ' LB · ' + s.mi + ' MI', steps: [s.ruck + ' lb · ' + s.mi + ' miles · 15:00/mi or faster (' + fmtMMSS(s.mi * 15 * 60) + ')', 'Walk fast, never jog downhill. Short quick steps on hills.', 'Hot spot? Stop and fix it now.'] },
        fuel: RGR_FUEL.slice(0, 4).concat([RGR_FUEL_RUCK, RGR_FUEL[4]]) }
    : { day: 'SATURDAY', focus: 'LONG RUN', time: '~' + Math.round(s.mi * 11 + 10) + ' MIN',
        run: { title: 'LONG RUN — ' + s.mi + ' MI EASY', steps: [s.mi + ' miles easy. ' + rgrEasy(), 'Engine, not a test. Walk a minute when the heart rate climbs.'] },
        fuel: RGR_FUEL.slice(0, 4).concat([RGR_FUEL_RUCK, RGR_FUEL[4]]) };
  d.sunday = { day: 'SUNDAY', focus: 'OFF', time: '—', recovery: ['Off. No training.', 'Optional: 20-30 min walk', '10 min mobility: hips, ankles, thoracic spine', 'Feet check, lay out Monday\'s gear'] };
  Object.keys(d).forEach(function(k){ d[k].week = wk; });
  return d;
}

function opMaxesCard() {
  const sk = opStartKey(), st = opCfg[sk];
  // Closed by default: it's a big block of inputs used once per cycle. The summary still says when a start date is missing.
  let h = '<details class="rgr-numbers"><summary>// ' + (currentProgram === 'op' ? 'OPERATOR MAXES' : 'MAXES + START') + ' ' + (st ? '— STARTS ' + st : '— SET A START DATE') + '</summary><div class="rgr-num-grid">'
    + '<label class="rgr-num"><span>START (WEEK 1 MONDAY)</span><input type="date" value="' + (st || '') + '" onchange="saveOpCfg(\'' + sk + '\', this)"><em>until it\'s set, the plan stays on the week you pick</em></label>';
  OP_FIELDS.forEach(function(f) {
    h += '<label class="rgr-num"><span>' + f.label + '</span><input inputmode="numeric" value="' + (opCfg[f.k] || '') + '" placeholder="' + opMax(f.k) + '" onchange="saveOpCfg(\'' + f.k + '\', this)"><em>lb' + (opCfg[f.k] ? '' : ' · using ' + opMax(f.k) + ' (pre-cut) until you enter one') + '</em></label>';
  });
  return h + '</div><div class="rgr-num-foot">' + (currentProgram === 'fm' ? 'Shared with Operator and Hybrid Warrior. Functional Muscle uses 55–78% of these for its sets of 8–12.' : currentProgram === 'hybrid' ? 'Shared with Operator and Functional Muscle. Hybrid Warrior uses 60–90% of these.' : 'Shared with the other programs. Operator works off a training max of 90% of these.') + ' Enter real numbers after BCT — heavy percentages off an old max are how people get hurt. Run paces come from the 2-mile in Ship Prep.</div></details>';
}

function updateOpCards() {
  const fm = currentProgram === 'fm', hw = currentProgram === 'hybrid';
  const w = currentBlock + 1, wk = (fm ? FM_WEEKS : hw ? HW_WEEKS : OP_WEEKS)[currentBlock], s = (fm ? FM_SAT : hw ? HW_SAT : OP_SAT)[currentBlock];
  const sc = fm ? FM_SCHEME[currentBlock] : hw ? HW_SCHEME[currentBlock] : null;
  const v = sc ? [sc[1], sc[0], sc[2]] : OP_WAVES[currentBlock];   // [reps, sets, %]
  document.getElementById('block-display').textContent = w;
  document.getElementById('pct-display').textContent = wk.type === 'BUILD' ? v[2] + '%' : wk.type;
  document.getElementById('progress-val').innerHTML = 'WEEK ' + w + ' <span>/ 12</span>';
  document.getElementById('progress-bar').style.width = (w / 12 * 100) + '%';
  document.getElementById('progress-card-2-label').textContent = '// main lifts';
  document.getElementById('intensity-val').innerHTML = wk.type === 'TEST' ? (fm ? 'RETEST <span>BW MAX</span>' : hw ? 'TEST <span>3RM</span>' : 'TEST <span>1RM</span>') : v[1] + ' x ' + v[0] + ' <span>@ ' + v[2] + '%</span>';
  document.getElementById('intensity-bar').style.width = (wk.type === 'TEST' ? 100 : v[2]) + '%';
  document.getElementById('prog-card-3-label').textContent = '// saturday';
  document.getElementById('prog-card-3-val').innerHTML = s.mi + ' <span>MI' + (s.ruck ? ' · ' + s.ruck + ' LB' : ' RUN') + '</span>';
  document.getElementById('prog-card-3-bar').style.width = (s.mi / 10 * 100) + '%';
}

function progData(w) { return currentProgram === 'fm' ? getFmData(w) : currentProgram === 'hybrid' ? getHwData(w) : getOpData(w); }
function renderOpWorkout() {
  const w = currentBlock + 1, day = progData(w)[currentDay];
  const content = document.getElementById('workout-content');
  const prefix = currentProgram + '-' + currentBlock + '-' + currentDay;   // op-…, fm-… or hybrid-…
  let html = (pbToday() < PB_SHIP ? '<div class="section"><button class="prog-tab" style="padding:6px 10px" onclick="setFullMode(false)">← BACK TO THE ROAD TO BCT</button></div>' : '') + opMaxesCard();
  html += '<div class="section"><div class="info-box">WEEK ' + w + ' · ' + day.week.tag + ' · ' + day.time + '<br><span style="color:var(--text-dim)">' + day.week.note + '</span></div></div>';
  if (day.recovery) {
    html += '<div class="section"><div class="section-label">// off day</div><div class="cooldown-items">'
      + day.recovery.map(function(x){ return '<div class="cooldown-item">' + x + '</div>'; }).join('') + '</div></div>';
  }
  if (day.lifts) {
    html += renderGymWarmup();
    html += '<div class="section"><div class="section-label">// ' + (currentProgram === 'fm' ? 'lift — compounds first, then the pump' : currentProgram === 'hybrid' ? 'lift — strength, then get out' : 'lift — power first, then strength') + '</div>' + renderLiftTable(day.lifts, prefix, null) + '</div>';
  }
  (day.circuits || []).forEach(function(c, ci) {
    html += '<div class="section"><div class="section-label">// ' + c.label + '</div>' + rgrList(c.items, prefix, 'c' + ci, c.title) + '<div class="rgr-num-foot">' + c.note + '</div></div>';
  });
  if (day.fuel) html += '<details class="rgr-numbers rgr-fuel"><summary>// FUEL + HYDRATE — read before you go</summary><div style="padding:0 12px 4px">' + rgrList(day.fuel, prefix, 'fuel', 'BEFORE · DURING · AFTER', true) + '</div></details>';
  if (day.run) html += '<div class="section"><div class="section-label">// ' + day.run.title.toLowerCase() + '</div>' + rgrRunCard(day.run, prefix) + '</div>';
  if (day.core) html += '<div class="section"><div class="section-label">// ' + (currentProgram === 'fm' ? 'carries + loaded mobility' : currentProgram === 'hybrid' ? 'plank' : 'core') + '</div>' + rgrList(day.core, prefix, 'core', currentProgram === 'fm' ? 'CARRY · HOLD · HANG' : currentProgram === 'hybrid' ? 'AFT PLANK' : 'CORE — 10 MIN') + '</div>';
  if (day.pm) html += '<div class="section"><div class="section-label">// note</div><div class="info-box">' + day.pm.toUpperCase() + '</div></div>';
  html += renderNotes(prefix);
  content.innerHTML = html;
  attachNotes(prefix);
}

// ============================================================
// FUNCTIONAL MUSCLE — 12 WEEKS (Nov 4, 2026; replaces Bodybuilding +, meant for after BCT)
// ============================================================
// Size that carries over: compound lifts first, single-leg work, carries and a short finisher every lift day,
// arms and delts still in it. Upper/lower split, 4 lift days + an easy engine day + a Saturday ruck or run.
// Main lifts are % of the maxes in OPERATOR MAXES (shared with Operator); its own start date is `fmStart` in `zach-op`.
// Three 4-week blocks: 12s with a slow lowering, then 10s, then 8s, each closing one rep nearer failure.
// Weeks 4 and 8 deload; week 12 is light lifting plus a bodyweight retest.
// Logs use `fm-` keys. The old Bodybuilding + logs (`bct-` keys) are still in the saved data; the program
// itself is in git history (git show 7133897:index.html, search getBCTData).
const FM_SCHEME = [   // [sets, reps, % of 1RM, reps left in the tank]
  [3, 12, 62, 3], [3, 12, 65, 2], [3, 12, 67, 1], [2, 10, 55, 4],
  [4, 10, 68, 2], [4, 10, 70, 2], [4, 10, 72, 1], [2, 10, 55, 4],
  [4, 8, 74, 2],  [4, 8, 76, 1],  [4, 8, 78, 1],  [2, 8, 55, 4],
];
const FM_WEEKS = [
  { type: 'BUILD',  tag: 'BLOCK 1 — TWELVES', note: 'Three seconds down on every rep. Light enough to own it: the muscle grows from time under tension, not the number on the bar.' },
  { type: 'BUILD',  tag: 'BLOCK 1 — TWELVES', note: 'A little more weight, one rep closer to failure.' },
  { type: 'BUILD',  tag: 'BLOCK 1 — PEAK',    note: 'One rep left in the tank on the last set of everything.' },
  { type: 'DELOAD', tag: 'DELOAD',            note: 'Two sets, light. Eat, sleep — growth happens this week.' },
  { type: 'BUILD',  tag: 'BLOCK 2 — TENS',    note: 'Four sets now. Add weight when every rep of every set goes with 2 left.' },
  { type: 'BUILD',  tag: 'BLOCK 2 — TENS',    note: 'Same plan, a bit heavier.' },
  { type: 'BUILD',  tag: 'BLOCK 2 — PEAK',    note: 'Last sets to 1 rep left. Finishers are the conditioning — don\'t skip them.' },
  { type: 'DELOAD', tag: 'DELOAD',            note: 'Back off before the heavy block.' },
  { type: 'BUILD',  tag: 'BLOCK 3 — EIGHTS',  note: 'Heaviest block. Compounds first while you\'re fresh; accessories chase the pump.' },
  { type: 'BUILD',  tag: 'BLOCK 3 — EIGHTS',  note: 'Push the main lifts. Accessories one rep from failure.' },
  { type: 'BUILD',  tag: 'BLOCK 3 — PEAK',    note: 'Last hard week. Then the retest.' },
  { type: 'TEST',   tag: 'RETEST',            note: 'Light lifting, plus max pull-ups, 2-min hand-release push-ups and max dips. Weigh in and take photos: this is the after picture.' },
];
// Saturday: moderate — this block is about building, not mileage
const FM_SAT = [
  { ruck: 35, mi: 4 }, { mi: 4 }, { ruck: 35, mi: 5 }, { mi: 3 },
  { ruck: 35, mi: 5 }, { mi: 5 }, { ruck: 40, mi: 5 }, { mi: 3 },
  { ruck: 40, mi: 6 }, { mi: 5 }, { ruck: 40, mi: 6 }, { mi: 4 },
];
function fmMain(name, k, w, cue) {
  const v = FM_SCHEME[w - 1];
  return { name: name, note: 'Leave ' + v[3] + ' rep' + (v[3] > 1 ? 's' : '') + ' in the tank. ' + cue + (w <= 3 ? ' 3 sec down.' : ''),
    sets: String(v[0]), reps: String(v[1]), lbs: String(Math.round(opMax(k) * v[2] / 100 / 5) * 5), rest: '2 MIN' };
}
function fmAcc(w) { const t = FM_WEEKS[w - 1].type; return t !== 'BUILD' ? ['2', '12'] : w <= 3 ? ['3', '15'] : w <= 7 ? ['3', '12'] : ['4', '10']; }
function fmFin(w, rows, title) { const t = FM_WEEKS[w - 1].type; return t !== 'BUILD' ? [] : [{ label: 'finisher — ready for action', title: title, items: rmxItems(rows), note: 'Hard and short. Done in 5–8 minutes.' }]; }

function getFmData(w) {
  const wk = FM_WEEKS[w - 1], a = fmAcc(w), test = wk.type === 'TEST';
  const pu = rgrPct('chins', 0.5, '5');
  const d = {};
  d.monday = { day: 'MONDAY', focus: 'LOWER A — SQUAT', time: '~60 MIN',
    lifts: [
      fmMain('BACK SQUAT', 'squat', w, 'Below parallel.'),
      { name: 'BULGARIAN SPLIT SQUAT', note: 'Back foot on a bench. Fixes the side that\'s behind.', sets: a[0], reps: a[1] === '15' ? '12 ea' : a[1] + ' ea', lbs: 'DBs' },
      { name: 'ROMANIAN DEADLIFT', note: 'Long stretch in the hamstrings.', sets: a[0], reps: a[1], lbs: 'RPE 8' },
      { name: 'NORDIC NEGATIVES', ss: 'L', ssPos: 'first', note: 'Lower as slow as you can. Hamstrings that don\'t pull when you sprint.', sets: a[0], reps: '5', lbs: 'BW' },
      { name: 'STANDING CALF RAISE', ss: 'L', ssPos: 'last', note: 'Pause at the bottom.', sets: a[0], reps: '15', lbs: 'MOD' },
    ],
    circuits: fmFin(w, [['SLED PUSH', '25m heavy'], ['WALK BACK', 'that\'s the rest']], '4 ROUNDS') };
  d.tuesday = { day: 'TUESDAY', focus: 'UPPER A — CHEST + BACK', time: '~60 MIN',
    lifts: (test ? [{ name: 'HAND-RELEASE PUSH-UPS — 2 MIN MAX', note: 'Fresh, first thing. Log it.', sets: '1', reps: 'MAX', lbs: 'BW', rest: '5 MIN' }] : []).concat([
      fmMain('BENCH PRESS', 'bench', w, 'Shoulder blades pinned.'),
      { name: 'CHEST-SUPPORTED DB ROW', note: 'Squeeze at the top for a second.', sets: a[0], reps: a[1], lbs: 'RPE 8' },
      { name: 'WEIGHTED PUSH-UPS', note: 'Plate on the back or a vest. Deep and slow.', sets: a[0], reps: a[1], lbs: '25-45' },
      { name: 'PULL-UPS', note: 'Dead hang, full range.', sets: a[0], reps: pu, lbs: 'BW' },
      { name: 'HAMMER CURLS', ss: 'A', ssPos: 'first', note: 'Forearms and grip, not just biceps.', sets: a[0], reps: a[1], lbs: 'DBs' },
      { name: 'DIPS', ss: 'A', ssPos: 'last', note: '', sets: a[0], reps: a[1], lbs: 'BW' },
    ]),
    circuits: fmFin(w, [['PUSH-UPS', '10'], ['INVERTED ROWS', '10']], 'EVERY MINUTE FOR 6 MIN') };
  d.wednesday = { day: 'WEDNESDAY', focus: 'ENGINE — EASY', time: '~45 MIN',
    run: { title: 'EASY RUN — ' + (w <= 4 ? 30 : w <= 8 ? 35 : 40) + ' MIN', steps: [(w <= 4 ? 30 : w <= 8 ? 35 : 40) + ' min easy. ' + rgrEasy(), 'Zone 2 keeps the engine without eating the recovery your muscles need.'] },
    core: [{ name: 'FARMER CARRY', detail: '4 x 50m — heavy' }, { name: 'SUITCASE CARRY', detail: '2 x 50m ea' }, { name: 'DEEP SQUAT HOLD', detail: '2 x 1:00 — hold a KB at your chest' }, { name: 'DEAD HANG', detail: '2 x 45 sec' }] };
  d.thursday = { day: 'THURSDAY', focus: 'LOWER B — HINGE', time: '~60 MIN',
    lifts: [
      fmMain('TRAP BAR DEADLIFT', 'deadlift', w, 'Push the floor away.'),
      { name: 'REVERSE LUNGE (FRONT FOOT ON A PLATE)', note: 'Deeper stretch, easy on the knees.', sets: a[0], reps: a[1] === '15' ? '12 ea' : a[1] + ' ea', lbs: 'DBs' },
      { name: 'HIP THRUST', note: 'Pause at the top. Glutes drive everything — sprints, rucks, the deadlift.', sets: a[0], reps: a[1], lbs: 'RPE 8' },
      { name: 'STEP-UPS', ss: 'H', ssPos: 'first', note: 'Knee-height box, drive through the heel.', sets: a[0], reps: '10 ea', lbs: 'DBs' },
      { name: 'COPENHAGEN PLANK', ss: 'H', ssPos: 'last', note: 'Groin insurance.', sets: a[0], reps: '20 SEC ea', lbs: 'BW' },
    ],
    circuits: fmFin(w, [['KB SWINGS', '15'], ['BURPEES', '5']], 'EVERY MINUTE FOR 6 MIN') };
  d.friday = { day: 'FRIDAY', focus: 'UPPER B — SHOULDERS + ARMS', time: '~60 MIN',
    lifts: (test ? [
      { name: 'PULL-UPS — MAX', note: 'Strict, dead hang. Log it.', sets: '1', reps: 'MAX', lbs: 'BW', rest: '5 MIN' },
      { name: 'DIPS — MAX', note: 'Full depth. Log it.', sets: '1', reps: 'MAX', lbs: 'BW', rest: '5 MIN' }] : []).concat([
      fmMain('STANDING PRESS', 'press', w, 'Strict: glutes tight, no leg drive.'),
      { name: 'WEIGHTED CHIN-UPS', note: '', sets: a[0], reps: w <= 3 ? '8' : '6', lbs: 'BW+' },
      { name: 'INCLINE DB PRESS', note: '', sets: a[0], reps: a[1], lbs: 'RPE 8' },
      { name: 'ONE-ARM DB ROW', note: '', sets: a[0], reps: a[1] + ' ea', lbs: 'RPE 8' },
      { name: 'LATERAL RAISES', ss: 'S', ssPos: 'first', note: 'Slow. No swing.', sets: a[0], reps: '15', lbs: 'Light' },
      { name: 'REAR DELT FLY', ss: 'S', ssPos: 'last', note: 'Shoulders that hold up under a ruck.', sets: a[0], reps: '15', lbs: 'Light' },
      { name: 'EZ BAR CURL', ss: 'B', ssPos: 'first', note: '', sets: a[0], reps: a[1], lbs: 'MOD' },
      { name: 'OVERHEAD TRICEP EXTENSION', ss: 'B', ssPos: 'last', note: '', sets: a[0], reps: a[1], lbs: 'MOD' },
    ]),
    circuits: fmFin(w, [['SANDBAG TO SHOULDER', '5 ea side'], ['FARMER CARRY', '50m']], '4 ROUNDS · REST 60 SEC') };
  const s = FM_SAT[w - 1];
  const fuel = RGR_FUEL.slice(0, 4).concat([RGR_FUEL_RUCK, RGR_FUEL[4]]);
  d.saturday = s.ruck
    ? { day: 'SATURDAY', focus: 'RUCK', time: '~' + Math.round(s.mi * 15 + 10) + ' MIN', fuel: fuel,
        run: { title: 'RUCK — ' + s.ruck + ' LB · ' + s.mi + ' MI', steps: [s.ruck + ' lb · ' + s.mi + ' miles · 15:00/mi or faster (' + fmtMMSS(s.mi * 15 * 60) + ')', 'Steady. This keeps your feet and back ruck-ready while you build.'] } }
    : { day: 'SATURDAY', focus: 'LONG RUN', time: '~' + Math.round(s.mi * 11 + 10) + ' MIN', fuel: fuel,
        run: { title: 'EASY RUN — ' + s.mi + ' MI', steps: [s.mi + ' miles easy. ' + rgrEasy()] } };
  d.sunday = { day: 'SUNDAY', focus: 'OFF', time: '—', recovery: ['Off. No training.', 'Eat: protein at every meal — this is when you grow.', '10 min mobility: hips, shoulders, thoracic spine', 'Weigh in Sunday mornings — up 0.25–0.5 lb a week is the target while building'] };
  Object.keys(d).forEach(function(k){ d[k].week = wk; });
  return d;
}

// ============================================================
// HYBRID WARRIOR — 12 WEEKS (rebuilt Nov 4, 2026; meant for after BCT)
// ============================================================
// Strength and engine, half and half: two strength days (squat + bench, deadlift + press), two quality runs
// (VO2 intervals, tempo), the Hyrox AMRAP with running in it, and a long run or ruck. Operator is the strength-first
// program and Functional Muscle the size-first one; this is the one with no weak side.
// Main lifts are % of the shared maxes in `zach-op`; the start date is `hwStart`. Paces come from Ship Prep's 2-mile.
// Logs use `hybrid-` keys. The Aug–Oct cycle's logs (`hyb-` keys) stay in the saved data; that program is in
// git history (git show a634a10:index.html, search getHybridData).
const HW_SCHEME = [   // [sets, reps, % of 1RM]
  [4, 6, 70], [4, 6, 72], [4, 6, 75], [3, 5, 60],
  [5, 4, 77], [5, 4, 80], [5, 4, 82], [3, 4, 60],
  [5, 3, 85], [5, 3, 87], [4, 3, 90], [0, 0, 0],
];
const HW_WEEKS = [
  { type: 'BUILD',  tag: 'BLOCK 1 — BASE',     note: 'Every session is about 60 minutes. Strength days stay short so the runs stay fast.' },
  { type: 'BUILD',  tag: 'BLOCK 1 — BASE',     note: 'Same plan, a little more of everything. Log the AMRAP rounds — that\'s your hybrid number.' },
  { type: 'BUILD',  tag: 'BLOCK 1 — PEAK',     note: 'Biggest week of the block.' },
  { type: 'DELOAD', tag: 'DELOAD',             note: 'Lighter lifts, easy runs, short AMRAP. Recover.' },
  { type: 'BUILD',  tag: 'BLOCK 2 — BUILD',    note: 'Heavier lifts, longer tempo. Hard days hard, easy days easy.' },
  { type: 'BUILD',  tag: 'BLOCK 2 — BUILD',    note: 'If the legs are flat on Tuesday, Monday was too heavy — drop a set.' },
  { type: 'BUILD',  tag: 'BLOCK 2 — PEAK',     note: 'Biggest week so far.' },
  { type: 'DELOAD', tag: 'DELOAD',             note: 'Back off before the last block.' },
  { type: 'BUILD',  tag: 'BLOCK 3 — SHARPEN',  note: 'Heavy triples, longest tempo, longest run. Sleep is training this block.' },
  { type: 'BUILD',  tag: 'BLOCK 3 — SHARPEN',  note: 'Push it.' },
  { type: 'BUILD',  tag: 'BLOCK 3 — PEAK',     note: 'Last hard week, then test.' },
  { type: 'TEST',   tag: 'HYBRID TEST WEEK',   note: '3-rep maxes Mon and Thu, 2-mile Tue, AMRAP benchmark Wed. Update your maxes (3RM ÷ 0.93 ≈ 1RM) and the 2-mile, then start the next cycle.' },
];
// Saturday: long run builds, a ruck every few weeks
const HW_SAT = [
  { mi: 5 }, { ruck: 35, mi: 4 }, { mi: 6 }, { mi: 4 },
  { mi: 7 }, { ruck: 35, mi: 6 }, { mi: 8 }, { ruck: 35, mi: 4 },
  { mi: 9 }, { ruck: 45, mi: 6 }, { mi: 10 }, { mi: 5 },
];
const HW_TEMPO = [15, 18, 20, 0, 20, 22, 25, 0, 25, 28, 30, 0];
// Wednesday AMRAP stations: A weeks and B weeks take turns
const HW_AMRAP = [
  [['400M RUN', 'steady — the run is part of the round'], ['HANG CLEAN → FRONT SQUAT', '6 · moderate, form first'], ['AUSSIE PULL-UPS', '12 · inverted rows under a bar'], ['HAND-RELEASE PUSH-UPS', '15'], ['BOX STEP-UPS', '10 ea · KB or DB in hand']],
  [['400M RUN', 'steady'], ['SANDBAG LUNGES', '20 steps · bag on the shoulders'], ['WALL BALLS', '15 · 20 lb (or sand ball thrusters)'], ['SLED PUSH', '25m heavy'], ['BURPEE BROAD JUMPS', '8']],
];

function hwMain(name, k, w, cue) {
  const v = HW_SCHEME[w - 1];
  if (w === 12) return { name: name + ' — 3RM TEST', note: 'Ramp: 50%×5, 70%×3, 80%×2, then triples in 10 lb jumps until one slows down a lot. Log the best.', sets: '1', reps: '3RM', lbs: 'WORK UP', rest: '3-4 MIN' };
  return { name: name, note: 'Warm-up sets first. ' + cue, sets: String(v[0]), reps: String(v[1]), lbs: String(Math.round(opMax(k) * v[2] / 100 / 5) * 5), rest: '2-3 MIN' };
}

function getHwData(w) {
  const wk = HW_WEEKS[w - 1], deload = wk.type === 'DELOAD', test = wk.type === 'TEST';
  const a = deload ? '2' : '3', pu = rgrPct('chins', 0.6, '6');
  const endcap = function(type) { const c = getCoreEndcap(w, type); return { label: 'core endcap — ' + c.blockName.toLowerCase(), title: c.blockName + ' — 10 MIN', items: c.slice(), note: 'Your practice-card rotation: anti-extension, posterior chain, anti-rotation, a hip opener.' }; };
  const d = {};
  d.monday = { day: 'MONDAY', focus: test ? 'TEST — SQUAT · BENCH' : 'STRENGTH A', time: '~60 MIN',
    lifts: [
      hwMain('BACK SQUAT', 'squat', w, 'Below parallel.'),
      hwMain('BENCH PRESS', 'bench', w, 'Pause the first rep of every set on the chest.'),
      { name: 'PULL-UPS', note: test ? 'Max reps, strict. Log it.' : 'Add 10 lb when every rep is clean.', sets: test ? '1' : a, reps: test ? 'MAX' : pu, lbs: test ? 'BW' : 'BW+' },
      { name: 'WALKING LUNGES', note: 'Long stride.', sets: a, reps: '10 ea', lbs: 'DBs' },
    ],
    circuits: [endcap('lower')] };
  const e = OP_ENGINE[w - 1];
  let tue;
  if (test) tue = { title: '2-MILE TIME TRIAL', steps: ['10 min easy + drills + 3 x 20 sec strides', '2 MILES all-out but even. Log it in Ship Prep\'s YOUR NUMBERS — every pace comes from it.', '10 min walk/jog cool-down'] };
  else if (e.easy) tue = { title: 'EASY RUN — 30 MIN', steps: ['30 min easy. ' + rgrEasy(), 'Deload — no intervals this week.'] };
  else if (e.time) tue = { title: e.time, steps: ['10 min easy + drills + 3 x 20 sec strides', e.time.toLowerCase() + ' — hard = about 5K race effort', e.note || 'Even efforts: the last rep looks like the first.', '10 min easy cool-down'] };
  else tue = { title: 'INTERVALS — ' + e.reps + ' x ' + e.label, steps: ['10 min easy + drills + 3 x 20 sec strides', e.reps + ' x ' + e.label + ' ' + rgrRepPace(e.m, e.fast) + ' — rest ' + e.rest].concat(e.note ? [e.note] : []).concat(['10 min easy cool-down']) };
  d.tuesday = { day: 'TUESDAY', focus: test ? 'TEST — 2-MILE' : 'RUN — INTERVALS', time: '~45 MIN', run: tue, fuel: RGR_FUEL };
  const mins = deload ? 15 : test ? 25 : 20 + Math.floor((w - 1) / 4) * 2;
  d.wednesday = { day: 'WEDNESDAY', focus: test ? 'TEST — AMRAP' : 'HYROX AMRAP', time: '~' + (mins + 20) + ' MIN',
    circuits: [{ label: 'hyrox amrap — run + stations', title: mins + '-MIN AMRAP · LOG ROUNDS', items: rmxItems(HW_AMRAP[(w - 1) % 2]),
      note: deload ? 'Deload: steady, conversational. Nothing to prove.' : test ? 'Benchmark: same stations as week 1 — beat its rounds.' : 'Pace it: about 4–5 minutes a round. Controlled beats blown up in round 1. Aim for one more round than the last time you did these stations.' }],
    core: [{ name: 'PLANK', detail: (PLANK_TARGETS[w - 1]) + ' — week ' + w + ' target' }] };
  if (test) d.wednesday.circuits[0].items = rmxItems(HW_AMRAP[0]);
  d.thursday = { day: 'THURSDAY', focus: test ? 'TEST — DEADLIFT · PRESS' : 'STRENGTH B', time: '~60 MIN',
    lifts: [
      hwMain('TRAP BAR DEADLIFT', 'deadlift', w, 'Push the floor away.'),
      hwMain('STANDING PRESS', 'press', w, 'Strict: glutes tight.'),
      { name: 'ONE-ARM DB ROW', note: '', sets: a, reps: '10 ea', lbs: 'RPE 8' },
      { name: 'FARMER CARRY', note: 'Heavy.', sets: a, reps: '50m', lbs: '2x70+', rest: '90 SEC' },
    ],
    circuits: [endcap('upper')] };
  const t = HW_TEMPO[w - 1];
  d.friday = { day: 'FRIDAY', focus: t ? 'RUN — TEMPO' : 'RUN — EASY', time: '~' + (t ? t + 25 : 30) + ' MIN', fuel: RGR_FUEL,
    run: t ? { title: 'TEMPO — ' + t + ' MIN', steps: ['10 min easy + 4 x 20 sec strides',
        t + ' min steady' + (rgrPaces() ? ' at ' + fmtMMSS(rgrPaces().tempoMi) + '/mi' : '') + ' — comfortably hard: a sentence, not a paragraph.', '10 min easy cool-down'] }
      : { title: 'EASY RUN — 30 MIN', steps: ['30 min easy. ' + rgrEasy(), test ? 'Test week — save the legs.' : 'Finish with 4 x 20 sec strides.'] } };
  const s = HW_SAT[w - 1];
  const fuel = RGR_FUEL.slice(0, 4).concat([RGR_FUEL_RUCK, RGR_FUEL[4]]);
  d.saturday = s.ruck
    ? { day: 'SATURDAY', focus: 'RUCK', time: '~' + Math.round(s.mi * 15 + 10) + ' MIN', fuel: fuel,
        run: { title: 'RUCK — ' + s.ruck + ' LB · ' + s.mi + ' MI', steps: [s.ruck + ' lb · ' + s.mi + ' miles · 15:00/mi or faster (' + fmtMMSS(s.mi * 15 * 60) + ')', 'Walk fast, never jog downhill.'] } }
    : { day: 'SATURDAY', focus: 'LONG RUN', time: '~' + Math.round(s.mi * 11 + 10) + ' MIN', fuel: fuel,
        run: { title: 'LONG RUN — ' + s.mi + ' MI EASY', steps: [s.mi + ' miles easy. ' + rgrEasy(), 'Walk a minute when the heart rate climbs — that\'s allowed.', 'Carbs the night before, electrolytes during.'] } };
  d.sunday = { day: 'SUNDAY', focus: 'RECOVERY', time: '30 MIN', recovery: ['Long walk — 10,000+ steps', '20 min full-body stretch', 'Sauna or cold plunge (optional)', 'Meal prep for the week'] };
  Object.keys(d).forEach(function(k){ d[k].week = wk; });
  return d;
}


// ============================================================
// ROAD TO BCT (Nov 5, 2026): the 11 weeks before BCT run through all four programs in order
// ============================================================
// Week numbers: gw = week of this plan (1–11, Mon Nov 9 → Sun Jan 24; 0 = this bridge week). ow = gw + 4 = the old
// 15-week Ship Prep week, which still supplies the runs (intervals, tempo, the checkpoint), Fri/Sat/Sun, SDC,
// InBody scans, the mock AFT and Sunday study. Each phase replaces Mon–Thu with its own lifting and calisthenics:
// Lift A Mon (after the track), Calisthenics A Tue, Lift B Wed (after the track), Calisthenics B Thu (home).
// Phase days log under `-p` keys. PB_START, PB_PHASES and PB_WEEKS sit next to RANGER_START (needed at load).
function pbL(name, sets, reps, lbs, note, rest, ss, ssPos) { return { name: name, sets: String(sets), reps: String(reps), lbs: lbs, note: note || '', rest: rest, ss: ss, ssPos: ssPos }; }
function pbC(label, title, rows, note) { return { label: label, title: title, items: rmxItems(rows), note: note }; }

function pbPhaseDays(gw, ow, d) {
  const ph = pbPhaseOfGw(gw).id, wk = PB_WEEKS[gw];
  const light = wk.type !== 'BUILD';
  const s = light ? 3 : 4, pu = rgrPct('chins', 0.6, '6'), plank = d.monday.lifts && d.monday.lifts[0];
  let monLifts = [], monC = [], tue = null, wedLifts = null, wedC = [], thu = null;
  if (ph === 'hybrid') {
    const r = '90 SEC';
    monLifts = [pbL('BENCH PRESS', s, 8, light ? 'RPE 6' : 'RPE 7', 'Three reps left in the tank.', r), pbL('PULL-UPS', s, pu, 'BW', 'Dead hang, full range.', r),
      pbL('DB PUSH PRESS', 3, 10, 'RPE 7', '', r), pbL('ONE-ARM DB ROW', 3, '10 ea', 'RPE 7', '', r), pbL('FARMER CARRY', 3, '50m', '2x50', '', r)];
    wedLifts = [pbL('TRAP BAR DEADLIFT', 4, 8, rgrDL(0.6), 'Smooth eights — the bar moves fast.', '2 MIN'), pbL('FRONT SQUAT', 3, 10, 'RPE 7', 'Upright torso.', r),
      pbL('BULGARIAN SPLIT SQUAT', 3, '8 ea', 'DBs', '', r), pbL('KB SWINGS', 3, 15, '53', '', r), pbL('WEIGHTED PLANK', 3, '45 SEC', '25', 'AFT form.', '60 SEC')];
    tue = pbC('calisthenics a — balanced', (light ? 2 : 3) + ' ROUNDS · REST 60 SEC', [['PULL-UPS', '8'], ['PUSH-UPS', '20'], ['DIPS', '12'], ['INVERTED ROWS', '12'], ['HOLLOW HOLD', '30 sec']], 'Clean reps, steady pace. Bar, dip station or two benches.');
    thu = pbC('calisthenics b — home (35 kb · sand ball)', (light ? 2 : 3) + ' ROUNDS · REST 60 SEC', [['KB SWINGS', '20'], ['PUSH-UPS', '15'], ['GOBLET SQUAT', '15'], ['SAND BALL SLAMS', '12'], ['BURPEES', '10']], 'Log total time.');
  } else if (ph === 'op') {
    const r = '2-3 MIN';
    monLifts = [pbL('BENCH PRESS', light ? 3 : 5, 5, light ? 'RPE 6' : 'RPE 8', 'Two reps left. Full rest — this is strength, not cardio.', r), pbL('WEIGHTED PULL-UPS', light ? 3 : 5, 5, 'BW+', 'Add 5 lb when all five sets are clean.', r),

          var nowF = flatten(), nowT = Date.now();
          Object.keys(nowF).forEach(function(k){ if (JSON.stringify(nowF[k]) !== JSON.stringify(merged[k])) { items[k] = { v: nowF[k], t: nowT }; s.h[k] = hash(JSON.stringify(nowF[k])); s.t[k] = nowT; } });
          Object.keys(merged).forEach(function(k){ if (merged[k] !== null && !(k in nowF)) { items[k] = { v: null, t: nowT }; s.h[k] = '-'; s.t[k] = nowT; } });
        }
        setJSON(SYNC, s);
        var same = file && Object.keys(items).length === Object.keys(ritems).length && Object.keys(items).every(function(k){
          var r = ritems[k]; return r && r.t === items[k].t && JSON.stringify(r.v) === JSON.stringify(items[k].v); });
        if (same) break;
        var body = { message: P + ' sync ' + new Date().toISOString(), content: b64(JSON.stringify({ format: P + '_sync_1', saved: new Date().toISOString(), items: items })) };
        if (file) body.sha = file.sha;
        var put = await fetch(url, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
        if (put.ok) break;
        if (put.status !== 409 && put.status !== 422) fail(put);
        if (attempt === 3) throw new Error('busy');
      }
      lsSet(AT, String(Date.now()));
      status();
    } catch (e) {
      status(e.message === 'token' ? '⚠ Token refused' : navigator.onLine === false ? '⚠ Offline' : '⚠ Sync failed');
    } finally {
      busy = false;
      if (reload) {
        // Another device's changes are in storage now; reload so the app reads them (at most a few times a minute)
        var n = Number(sessionStorage.getItem(P + '_sync_reloads') || 0), last = Number(sessionStorage.getItem(P + '_sync_reload_at') || 0);
        if (Date.now() - last > 60000) n = 0;
        if (n < 3) { sessionStorage.setItem(P + '_sync_reloads', n + 1); sessionStorage.setItem(P + '_sync_reload_at', Date.now()); location.reload(); return; }
      }
      if (again) { again = false; sync(); }
    }
  }

  function status(msg){
    var b = document.getElementById(P + '-sync-btn'); if (!b) return;
    var c = cfg(), at = Number(store.getItem(AT)) || 0;
    b.textContent = msg || (!c.token ? '☁ SYNC OFF' : at ? '☁ SYNCED ' + new Date(at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '☁ SYNC');
    b.style.color = msg && msg.charAt(0) === '⚠' ? '#e05252' : '';
  }
  function foundToken(){
    var list = [['subroutine_gh_cfg', 'Subroutine'], ['teacher_book_gh_cfg', 'Teacher Book'], ['hc_gh_cfg', 'Head Coach HQ'], ['cb_gh_cfg', 'Cook Book'], ['hw_gh_cfg', 'Hybrid Warrior']];
    for (var i = 0; i < list.length; i++) {
      if (list[i][0] === CFG) continue;
      var c = getJSON(list[i][0], {});
      if (c.token && (!c.repo || String(c.repo).toLowerCase() === 'subroutine-data')) return { token: c.token, name: list[i][1] };
    }
    return null;
  }
  function openSync(){
    var old = document.getElementById(P + '-sync-modal'); if (old) old.remove();
    var c = cfg(), found = !c.token && foundToken();
    var ov = document.createElement('div'); ov.id = P + '-sync-modal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px';
    var bs = 'border-radius:8px;padding:9px 14px;font:600 13px system-ui,sans-serif;cursor:pointer;';
    ov.innerHTML = '<div style="background:#16181d;color:#eee;border:1px solid #444;border-radius:12px;padding:20px;max-width:420px;width:100%;font:14px/1.45 system-ui,sans-serif">' +
      '<div style="font-weight:700;letter-spacing:1px;margin-bottom:6px">SYNC ACROSS DEVICES</div>' +
      '<div style="font-size:12.5px;opacity:.8;margin-bottom:14px">Saves this book to <b>' + FILE + '</b> in your private <b>subroutine-data</b> repo and merges with your other devices piece by piece. Use a GitHub fine-grained token with <b>Contents: read and write</b> on subroutine-data (the one Subroutine uses works).</div>' +
      (found ? '<button id="' + P + '-sync-found" style="' + bs + 'width:100%;margin-bottom:10px;background:#3b82f6;color:#fff;border:none">Use the token ' + found.name + ' saved here</button>' : '') +
      '<input id="' + P + '-sync-token" type="password" autocomplete="off" placeholder="' + (c.token ? 'Token saved (paste to replace)' : 'Paste token') + '" style="width:100%;box-sizing:border-box;padding:9px 10px;border-radius:8px;border:1px solid #555;background:#0e0f12;color:#eee;margin-bottom:12px">' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">' +
      (c.token ? '<button id="' + P + '-sync-off" style="' + bs + 'background:none;color:#e05252;border:1px solid #e05252">Turn off</button>' : '') +
      '<button id="' + P + '-sync-close" style="' + bs + 'background:none;color:#ccc;border:1px solid #555">Close</button>' +
      '<button id="' + P + '-sync-go" style="' + bs + 'background:#3b82f6;color:#fff;border:none">' + (c.token ? 'Sync now' : 'Connect') + '</button></div></div>';
    document.body.appendChild(ov);
    var $ = function(id){ return document.getElementById(P + '-sync-' + id); };
    var connect = function(token){ if (token) setJSON(CFG, { token: token }); if (!cfg().token) { alert('Paste a token first.'); return; } ov.remove(); start(); sync(); };
    ov.onclick = function(e){ if (e.target === ov) ov.remove(); };
    $('close').onclick = function(){ ov.remove(); };
    $('go').onclick = function(){ connect($('token').value.trim()); };
    if (found) $('found').onclick = function(){ connect(found.token); };
    if ($('off')) $('off').onclick = function(){
      if (!confirm('Turn off sync on this device? Your data stays here and on GitHub.')) return;
      [CFG, SYNC, AT].forEach(lsRemove); ov.remove(); status();
    };
  }
  window['hwOpenSync'] = openSync;
  window['hwSync'] = sync;

  // Any write to this book's keys schedules a sync
  var started = false;
  function start(){
    if (started) return; started = true;
    Storage.prototype.setItem = function(k, v){ rawSet.call(this, k, v); if (this === store && own(String(k))) schedule(); };
    Storage.prototype.removeItem = function(k){ rawRemove.call(this, k); if (this === store && own(String(k))) schedule(); };
    document.addEventListener('visibilitychange', function(){ if (document.hidden) { if (timer) sync(); } else sync(); });
    document.addEventListener('focusout', function(){ if (waitBlur) { waitBlur = false; setTimeout(sync, 300); } });
  }
  function schedule(){ if (!cfg().token) return; if (stamp()) status('Saving…'); clearTimeout(timer); timer = setTimeout(sync, 2500); }

  function init(){
    var mount = document.querySelector('.data-bar-btns');
    if (mount && !document.getElementById(P + '-sync-btn')) {
      var b = document.createElement('button'); b.id = P + '-sync-btn'; b.className = 'prog-tab'; b.onclick = openSync;
      b.title = 'Sync this book across your devices'; mount.appendChild(b);
    }
    status();
    if (cfg().token) { start(); sync(); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
