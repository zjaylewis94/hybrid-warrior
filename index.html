  :root[data-prog="hybrid"] { --yellow: #ff8c1a; --yellow-dim: #cc6f12; --accent-rgb: 255,140,26;  --olive: #5a4636; --olive-light: #8c6b50; }
  :root[data-prog="op"]     { --yellow: #e5383b; --yellow-dim: #b02a2d; --accent-rgb: 229,56,59;   --olive: #4a4f57; --olive-light: #747c87; }
  :root[data-prog="fm"]     { --yellow: #3fc1e0; --yellow-dim: #2a93ab; --accent-rgb: 63,193,224;  --olive: #3e4f5a; --olive-light: #5f7a88; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.55;
  }
  /* Behind everything: a soft glow in the program's color over the program's camo, darkened so the cards stay readable */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image:
      radial-gradient(900px 600px at 10% -5%, rgba(var(--accent-rgb),0.18), transparent 65%),
      radial-gradient(800px 700px at 100% 105%, rgba(var(--accent-rgb),0.10), transparent 60%),
      linear-gradient(180deg, rgba(16,17,14,0.80) 0%, rgba(11,12,10,0.88) 100%),
      var(--camo);
    background-size: auto, auto, auto, 320px 320px;
    background-color: var(--bg);
  }

  /* HEADER */
  .header {
    border-bottom: 2px solid var(--yellow);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--black);
    z-index: 100;
  }

  .header-left { display: flex; flex-direction: column; }

  .header-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--yellow);
    letter-spacing: 4px;
    line-height: 1;
  }

  .header-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-top: 2px;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .block-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 3px;
    color: var(--white);
  }
  .block-badge span { color: var(--yellow); }

  /* PROGRAM TAB SWITCHER */
  .program-switcher {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
    border-radius: 2px;
    margin-bottom: 0;
  }

  .prog-tab {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    padding: 8px 20px;
    background: var(--dark);
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    border-right: 1px solid var(--border);
    transition: all 0.15s;
    letter-spacing: 2px;
  }

  .prog-tab:last-child { border-right: none; }
  .prog-tab:hover { background: var(--panel); color: var(--text); }
  .prog-tab.active { background: var(--yellow); color: var(--black); }

  /* BLOCK SELECTOR */
  .block-nav {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
    border-radius: 2px;
  }

  .block-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    padding: 5px 10px;
    background: var(--dark);
    color: var(--text-dim);
    border: none;
    cursor: pointer;
    border-right: 1px solid var(--border);
    transition: all 0.15s;
    letter-spacing: 1px;
  }

  .block-btn:last-child { border-right: none; }
  .block-btn:hover { background: var(--panel); color: var(--text); }
  .block-btn.active { background: var(--yellow); color: var(--black); font-weight: bold; }

  /* MAIN LAYOUT */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

  /* WEEK STRIP */
  .week-strip {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .day-tab {
    flex: 1;
    min-width: 120px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 3px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .day-tab:hover { border-color: var(--olive); background: var(--dark); }
  .day-tab.active { border-top-color: var(--yellow); border-color: var(--olive); background: var(--dark); }
  .day-tab.rest { opacity: 0.4; cursor: default; border-top-color: var(--border); }

  .day-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 3px; color: var(--white); }
  .day-focus { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }
  .day-tab.active .day-label { color: var(--yellow); }
  .day-tab.active .day-focus { color: var(--olive-light); }

  /* WORKOUT PANEL */
  .workout-panel { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* SECTIONS */
  .section { margin-bottom: 24px; }

  .section-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 4px;
    color: var(--olive-light);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .info-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--olive);
    padding: 12px 20px;
    font-size: 0.9rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* KB PRIME BOX */
  .kb-prime-box {
    background: rgba(var(--accent-rgb),0.06);
    border: 1px solid var(--yellow-dim);
    border-left: 4px solid var(--yellow);
    padding: 14px 20px;
    margin-bottom: 16px;
  }

  .kb-prime-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 3px;
    color: var(--yellow);
    margin-bottom: 8px;
  }

  .kb-prime-items { display: flex; flex-wrap: wrap; gap: 8px; }

  .kb-prime-item {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    padding: 4px 10px;
    background: rgba(var(--accent-rgb),0.08);
    border: 1px solid rgba(var(--accent-rgb),0.2);
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* WORKOUT TABLE */
  .workout-table { width: 100%; border-collapse: collapse; }
  .workout-table thead tr { background: var(--yellow); }
  .workout-table thead th {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 3px;
    color: var(--black);
    padding: 10px 14px;
    text-align: left;
    border-right: 1px solid rgba(0,0,0,0.15);
  }
  .workout-table thead th:last-child { border-right: none; }
  .workout-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .workout-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
  .workout-table tbody tr:hover { background: rgba(var(--accent-rgb),0.04); }
  .workout-table tbody td { padding: 10px 14px; font-size: 0.9rem; letter-spacing: 1px; border-right: 1px solid var(--border); vertical-align: middle; }
  .workout-table tbody td:last-child { border-right: none; }

  .lift-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--white); letter-spacing: 1px; }
  .lift-note { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 1px; margin-top: 2px; }
  .rest-note { font-size: 0.68rem; color: var(--yellow-dim); letter-spacing: 1px; margin-top: 3px; opacity: 0.85; }

  .acft-tag {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    padding: 2px 5px;
    background: rgba(var(--accent-rgb),0.15);
    border: 1px solid var(--yellow-dim);
    color: var(--yellow);
    letter-spacing: 1px;
    margin-top: 3px;
    border-radius: 1px;
  }

  .hybrid-tag {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    padding: 2px 5px;
    background: rgba(46,125,163,0.15);
    border: 1px solid var(--blue);
    color: #6ab4d4;
    letter-spacing: 1px;
    margin-top: 3px;
    border-radius: 1px;
  }

  .sets-reps { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--text); }

  .pct-badge {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--yellow-dim);
    background: rgba(var(--accent-rgb),0.08);
    padding: 3px 8px;
    border: 1px solid rgba(var(--accent-rgb),0.2);
    border-radius: 1px;
  }

  .done-check {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin: 0 auto;
    font-size: 0.8rem;
  }
  .done-check.checked { background: var(--green); border-color: var(--green); color: white; }
  .done-check:hover { border-color: var(--yellow); }

  /* RUN CARD */
  .run-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--yellow); padding: 16px 20px; }
  .run-card-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 3px; color: var(--yellow); margin-bottom: 10px; }
  .run-intervals { display: flex; flex-direction: column; gap: 8px; }
  .run-interval { display: flex; align-items: center; gap: 16px; padding: 8px 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); }
  .run-interval-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: var(--yellow-dim); min-width: 28px; }
  .run-interval-desc { flex: 1; font-size: 0.85rem; color: var(--text); letter-spacing: 1px; }
  .run-interval-detail { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--text-dim); }

  /* HYROX CARD */
  .hyrox-card {
    background: var(--panel);
    border: 1px solid var(--blue);
    border-left: 4px solid var(--blue);
    padding: 16px 20px;
  }
  .hyrox-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    color: #6ab4d4;
    margin-bottom: 4px;
  }
  .hyrox-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  /* PROGRESS CARDS */
  .progress-section { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .progress-card { background: var(--panel); border: 1px solid var(--border); padding: 14px 16px; }
  .progress-card-label { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 3px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; }
  .progress-card-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 2px; color: var(--white); }
  .progress-card-value span { color: var(--yellow); font-size: 1rem; }
  .progress-bar-wrap { height: 4px; background: var(--border); margin-top: 8px; border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--yellow); border-radius: 2px; transition: width 0.4s ease; }

  /* NOTES */
  .notes-area {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    padding: 12px 16px;
    resize: vertical;
    min-height: 80px;
    letter-spacing: 1px;
    outline: none;
  }
  .notes-area:focus { border-color: var(--olive); }

  /* COOLDOWN */
  .cooldown-items { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .cooldown-item { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; letter-spacing: 2px; padding: 6px 14px; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); text-transform: uppercase; }

  /* LEG TUCK */
  .lt-tracker { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--yellow); padding: 16px 20px; }
  .lt-tracker-title { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 3px; color: var(--yellow); margin-bottom: 12px; }
  .lt-sets { display: flex; flex-direction: column; gap: 6px; }
  .lt-set { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); font-size: 0.85rem; letter-spacing: 1px; }
  .lt-set-label { color: var(--text); }
  .lt-set-detail { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--text-dim); }

  /* WEEK MILEAGE TRACKER */
  .mileage-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .mile-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 8px;
    text-align: center;
  }
  .mile-card-week { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--text-dim); letter-spacing: 1px; }
  .mile-card-dist { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--white); }
  .mile-card-dist span { color: var(--yellow); font-size: 0.75rem; }
  .mile-card.current { border-color: var(--yellow); background: rgba(var(--accent-rgb),0.05); }
  .mile-card.current .mile-card-week { color: var(--yellow); }

  /* FOOTER */
  .footer { border-top: 1px solid var(--border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
  .footer-text { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }
  .footer-date { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 2px; color: var(--olive-light); }


  /* ============================================================
     MOBILE RESPONSIVE — phones < 640px
  ============================================================ */
  @media (max-width: 640px) {

    /* Header — stack vertically */
    .header {
      padding: 10px 14px;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .header-name { font-size: 1.4rem; letter-spacing: 2px; }
    .header-sub  { font-size: 0.55rem; letter-spacing: 1px; }
    .header-right {
      width: 100%;
      align-items: flex-start;
      gap: 6px;
    }
    .header-right > div {
      width: 100%;
      flex-wrap: wrap;
    }
    .block-badge { font-size: 0.9rem; }

    /* Program switcher — full width */
    .program-switcher { flex: 1 1 100%; }
    .prog-tab { font-size: 0.75rem; padding: 6px 4px; flex: 1; white-space: nowrap; letter-spacing: 1px; }

    /* Block nav — smaller buttons */
    .block-nav { flex-wrap: wrap; }
    .block-btn { font-size: 0.55rem; padding: 4px 7px; }

    /* Container padding */
    .container { padding: 12px 10px; }

    /* Progress cards — single column */
    .progress-section {
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }
    .progress-card { padding: 10px 12px; }
    .progress-card-value { font-size: 1.2rem; }

    /* Day tabs — horizontal scroll, smaller */
    .week-strip { gap: 5px; margin-bottom: 14px; }
    .day-tab { min-width: 70px; padding: 8px 6px; }
    .day-label { font-size: 0.75rem; letter-spacing: 1px; }
    .day-focus { font-size: 0.5rem; letter-spacing: 0; }

    /* Section labels */
    .section { margin-bottom: 14px; }
    .section-label { font-size: 0.55rem; letter-spacing: 2px; }

    /* Info box */
    .info-box { font-size: 0.75rem; letter-spacing: 0.5px; padding: 10px 12px; }

    /* ── WORKOUT TABLE — card layout on mobile ── */
    .workout-table { display: block; }
    .workout-table thead { display: none; }  /* hide headers */
    .workout-table tbody { display: block; }
    .workout-table tbody tr {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      grid-template-areas:
        "name name name name"
        "lbs  sets reps done";
      border: 1px solid var(--border);
      margin-bottom: 6px;
      background: var(--panel);
    }
    .workout-table tbody td {
      display: block;
      border: none;
      padding: 7px 10px;
      font-size: 0.8rem;
      vertical-align: top;
    }
    /* Lift name — full width top row */
    .workout-table tbody td:nth-child(1) {
      grid-area: name;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
    }
    /* LBS */
    .workout-table tbody td:nth-child(2) { grid-area: lbs; }
    .workout-table tbody td:nth-child(2)::before {
      content: 'LBS'; font-size: 0.5rem; color: var(--text-dim);
      letter-spacing: 2px; display: block; margin-bottom: 3px;
    }
    /* SETS */
    .workout-table tbody td:nth-child(3) {
      grid-area: sets; border-left: 1px solid var(--border);
    }
    .workout-table tbody td:nth-child(3)::before {
      content: 'SETS'; font-size: 0.5rem; color: var(--text-dim);
      letter-spacing: 2px; display: block; margin-bottom: 3px;
    }
    /* REPS */
    .workout-table tbody td:nth-child(4) {
      grid-area: reps; border-left: 1px solid var(--border);
    }
    .workout-table tbody td:nth-child(4)::before {
      content: 'REPS'; font-size: 0.5rem; color: var(--text-dim);
      letter-spacing: 2px; display: block; margin-bottom: 3px;
    }
    /* DONE — right cell, centered */
    .workout-table tbody td:nth-child(5) {
      grid-area: done;
      border-left: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
    }
    .workout-table tbody td:nth-child(5)::before {
      content: 'DONE'; font-size: 0.5rem; color: var(--text-dim);
      letter-spacing: 1px; position: absolute; transform: translateY(-16px);
    }

    .lift-name  { font-size: 0.85rem; }
    .lift-note  { font-size: 0.65rem; }
    .rest-note  { font-size: 0.62rem; }
    .pct-badge  { font-size: 0.7rem; padding: 2px 5px; }
    .sets-reps  { font-size: 0.75rem; }
    .acft-tag, .hybrid-tag { font-size: 0.5rem; }

    /* Run card */
    .run-card { padding: 12px 14px; }
    .run-card-title { font-size: 0.85rem; letter-spacing: 2px; }
    .run-interval { padding: 6px 8px; gap: 10px; }
    .run-interval-num { font-size: 0.95rem; min-width: 20px; }
    .run-interval-desc { font-size: 0.75rem; }
    .run-interval-detail { font-size: 0.65rem; }

    /* Hyrox card */
    .hyrox-card { padding: 12px 14px; }
    .hyrox-title { font-size: 0.85rem; letter-spacing: 2px; }
    .hyrox-sub { font-size: 0.6rem; letter-spacing: 1px; }

    /* LT tracker / core block */
    .lt-tracker { padding: 12px 14px; }
    .lt-tracker-title { font-size: 0.8rem; letter-spacing: 2px; }
    .lt-set { flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px 10px; }
    .lt-set-label { font-size: 0.8rem; }
    .lt-set-detail { font-size: 0.7rem; }

    /* KB prime box */
    .kb-prime-box { padding: 10px 12px; }
    .kb-prime-title { font-size: 0.7rem; letter-spacing: 2px; }
    .kb-prime-items { gap: 6px; }
    .kb-prime-item { font-size: 0.65rem; padding: 4px 8px; }

    /* Mileage grid — 6 cols instead of all 12 */
    .mileage-grid { grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .mile-card { padding: 7px 4px; }
    .mile-card-dist { font-size: 0.9rem; }

    /* Cooldown */
    .cooldown-items { gap: 6px; }
    .cooldown-item { font-size: 0.6rem; padding: 5px 10px; }

    /* Notes */
    .notes-area { font-size: 0.75rem; min-height: 60px; }

    /* Footer */
    .footer { padding: 12px 14px; flex-direction: column; gap: 4px; text-align: center; }
    .footer-text { font-size: 0.5rem; letter-spacing: 1px; }
  }



  /* ── DAY SPLIT: GYM vs HOME blocks ── */
  .day-block {
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .day-block-header {
    padding: 10px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .day-block-header .sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 1px;
    opacity: 0.85;
    margin-left: auto;
    text-transform: uppercase;
  }
  .day-block.gym .day-block-header { background: var(--yellow); color: var(--black); }
  .day-block.home .day-block-header { background: var(--olive); color: var(--white); }
  .day-block-body { padding: 14px 14px 4px; }
  @media (max-width: 640px) {
    .day-block-header { font-size: 1.05rem; letter-spacing: 2px; padding: 8px 12px; }
    .day-block-header .sub { font-size: 0.5rem; }
    .day-block-body { padding: 10px 8px 2px; }
  }


  /* Hybrid Warrior II — your numbers */
  .rgr-numbers { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--olive-light); margin-bottom: 20px; }
  .rgr-numbers summary { cursor: pointer; padding: 12px 16px; font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; letter-spacing: 2px; color: var(--yellow); }
  .rgr-num-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; padding: 4px 16px 4px; }
  .rgr-num { display: flex; flex-direction: column; gap: 3px; }
  .rgr-num span { font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; letter-spacing: 2px; color: var(--white); }
  .rgr-num input { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--yellow); font-family: 'Share Tech Mono', monospace; font-size: 0.95rem; padding: 6px 8px; outline: none; width: 100%; }
  .rgr-num input:focus { border-color: var(--yellow); }
  .rgr-num em { font-style: normal; font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1px; }
  .rgr-num-foot { padding: 10px 16px 14px; font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.5px; line-height: 1.5; }
  .section > .rgr-num-foot { padding: 8px 2px 0; }
  @media (max-width: 640px) { .rgr-num-grid { grid-template-columns: 1fr 1fr; } }

  /* actual-performed log input */
  .actual-input {
    display: block;
    margin-top: 4px;
    width: 72px;
    background: rgba(255,255,255,0.04);
    border: 1px dashed var(--border);
    border-radius: 2px;
    color: var(--yellow);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    padding: 3px 6px;
    outline: none;
  }
  .actual-input:focus { border-color: var(--yellow); border-style: solid; }
  .actual-input::placeholder { color: var(--text-dim); opacity: 0.5; }

  /* ── SUPERSET GROUPING ── */
  .workout-table tbody tr.ss-row td:first-child {
    border-left: 3px solid var(--blue);
  }
  .workout-table tbody tr.ss-first td {
    border-top: 2px solid var(--blue);
  }
  .workout-table tbody tr.ss-last td {
    border-bottom: 2px solid var(--blue);
  }
  .workout-table tbody tr.ss-row td:first-child { padding-left: 18px; }
  .ss-badge {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    padding: 2px 6px;
    background: rgba(46,125,163,0.18);
    border: 1px solid var(--blue);
    color: #6ab4d4;
    letter-spacing: 1px;
    border-radius: 1px;
    margin-bottom: 3px;
  }
  .ss-link {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: #6ab4d4;
    letter-spacing: 1px;
    padding: 3px 0 3px 18px;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--dark); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--olive); }
  .data-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 28px 0 8px; padding: 12px 14px; border: 1px solid var(--border); }
  .data-bar-text { font-size: 0.8rem; letter-spacing: 1px; opacity: 0.7; }
  .data-bar-btns { display: flex; gap: 8px; }
  /* GLASS — cards float over the background: blur what's behind, a thin top highlight, a soft shadow */
  .header { background: rgba(14,15,12,0.75); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); }
  .progress-card, .run-card, .lt-tracker, .rgr-numbers, .info-box, .kb-prime-box, .hyrox-card, .mile-card, .day-tab, .data-bar, .notes-area {
    backdrop-filter: blur(10px) saturate(1.3);
    -webkit-backdrop-filter: blur(10px) saturate(1.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.28);
    border-radius: 6px;
  }
  .workout-table { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,0.28); }
</style>

<body>

<header class="header">
  <div class="header-left">
    <div class="header-name">PROVING GROUNDS</div>
    <div class="header-sub" id="header-sub">// ROAD TO BCT</div>
  </div>
  <div class="header-right">
    <div class="block-badge"><b id="block-word" style="font-weight:normal">BLOCK</b> <span id="block-display">1</span> &mdash; <span id="pct-display">60%</span></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="program-switcher">
        <button class="prog-tab" data-prog="hybrid" onclick="setProgram('hybrid')">HYBRID WARRIOR</button>

function isOwnKey(k) { return k.indexOf('zach') === 0 || k.indexOf('rgr-') === 0 || k.indexOf('notes-') === 0; }
function backupData() {
  var data = {};
  for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (isOwnKey(k)) data[k] = localStorage.getItem(k); }
  var blob = new Blob([JSON.stringify({ book: 'hybrid-warrior', saved: new Date().toISOString(), data: data }, null, 1)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'workout_book_backup_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function restoreData() {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var j; try { j = JSON.parse(r.result); } catch (e) { j = null; }
      if (!j || j.book !== 'hybrid-warrior' || !j.data) { alert("That file isn't a Workout Book backup."); return; }
      if (!confirm('Replace the log, checkmarks and notes in this browser with the backup from ' + String(j.saved || '').slice(0, 10) + '?')) return;
      var old = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (isOwnKey(k)) old.push(k); }
      old.forEach(function (k) { localStorage.removeItem(k); });
      Object.keys(j.data).forEach(function (k) { if (isOwnKey(k)) localStorage.setItem(k, j.data[k]); });

    r.readAsText(f);

}

function parseMMSS(s) {
  const m = /^(?:(\d+):)?(\d{1,2}):([0-5]\d)$/.exec(String(s || '').trim());
  return m ? (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) : null;
}
function fmtMMSS(sec) { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

// Paces from the 2-mile (or the Week 1 4-mile, scaled, until a 2-mile is logged).
// Goal: ~5% faster per mile at a time, down to the 15:30 target; once under it, 2% more at a time.
const TWO_MILE_TARGET = 930;
function rgrPaces() {
  let t = parseMMSS(rgrNum.twoMile);
  if (!t) { const four = parseMMSS(rgrNum.fourMile); if (four) t = Math.round(four * Math.pow(0.5, 1.06)); }
  if (!t) return null;
  const curMi = t / 2, tgtMi = TWO_MILE_TARGET / 2;
  const goalMi = curMi > tgtMi ? Math.max(tgtMi, curMi * 0.95) : curMi * 0.98;
  return { current: t, dist: 2, goal: Math.round(goalMi * 2), goalMi: goalMi, curMi: curMi, tempoMi: curMi + 25, easyLo: curMi + 90, easyHi: curMi + 150 };
}
function rgrRepPace(meters, fasterPer400) {
  const p = rgrPaces();

  if (!p) return 'at goal 2-mile effort (log a 2-mile for exact splits; ' + gate + ')';
  const rep = p.goalMi * meters / 1609.34 - (fasterPer400 || 0) * meters / 400;
  return '@ ' + fmtMMSS(rep) + ' each (goal pace ' + fmtMMSS(p.goalMi) + '/mi; ' + gate + ')';
}

    const rsteps = [s.lbs + ' lb · ' + s.mi + ' miles · 15:00/mi or faster (' + fmtMMSS(s.mi * 15 * 60) + ')',
      'Walk fast, never jog downhill. Short quick steps on hills.',
      'Hot spot? Stop and fix it now. Feet are the #1 reason people fail rucks.'];
    if (s.note) rsteps.push(s.note);
    d.saturday = { day: 'SATURDAY', focus: 'RUCK', time: '~' + Math.round(s.mi * 15 + 10) + ' MIN',
      run: { title: 'RUCK — ' + s.lbs + ' LB · ' + s.mi + ' MI', steps: rsteps },
      fuel: RGR_FUEL.slice(0, 4).concat([RGR_FUEL_RUCK, RGR_FUEL[4]]) };
  } else {
    const lsteps = [s.mi + ' miles easy. ' + rgrEasy(), 'Walk a minute any time the HR climbs — that\'s allowed, not cheating.',
      'Time on feet builds the 2-mile engine without beating up your legs.'];
    if (s.note) lsteps.push(s.note);
    d.saturday = { day: 'SATURDAY', focus: 'LONG RUN', time: '~' + Math.round(s.mi * 11 + 10) + ' MIN',
      run: { title: 'LONG RUN — ' + s.mi + ' MI EASY', steps: lsteps },
      fuel: RGR_FUEL.slice(0, 4).concat([RGR_FUEL_RUCK, RGR_FUEL[4]]) };
  }
  d.saturday.grid = true;

  // SUNDAY — OFF + check-in + 20 min study
  const scan = SCAN_WEEKS[w];
  d.sunday = { day: 'SUNDAY', focus: scan ? 'OFF · INBODY SCAN #' + scan : 'OFF · STUDY', time: '25 MIN',
    nav: RGR_NAV[w - 1], navLabel: w <= 8 ? 'land nav — 20 min with tc 3-25.26' : 'bct prep — 20 min',
    recovery: (scan ? ['INBODY SCAN #' + scan + ' — morning, fasted, after the bathroom, before training. Watch: muscle holds near 120 lb, fat mass drops.'] : [])
      .concat(['Chores, errands, planning — no training.', 'Feet check: blisters, nails, hot spots', 'Lay out Monday\'s gear tonight']),
    checkin: true };

  rgrRemix(w, d);
  Object.keys(d).forEach(function(k){ d[k].week = wk; });
  return d;
}

// ============================================================
// SHIP PREP REMIX (Nov 4, 2026): week 4 from Wednesday, then weeks 5–15
// ============================================================
// The week changed: track with the team Mon + Wed (Tue optional, the kids want extra), Future Soldier on Thu
// (classroom, so not a workout). Zach wanted circuits and calisthenics, light loads and short rest, in place of
// the short maintenance lifts. What stays fixed: the 2-mile and the plank are still the gap to AFT 465, so the hard
// run and the plank work keep their place, and the circuits work around them.
//   MON  track: the hard run (intervals) → school weight room: plank + UPPER circuit
//   TUE  optional easy run with the kids + grease the groove
//   WED  track: tempo or easy → weight room: trap bar (the one heavy thing, capped at 340) + LOWER circuit + SDC
//   THU  home (35 lb KB, mat, 10 lb sand ball): COMBAT circuit + the long plank. Future Soldier class before or after.
//   FRI off (earned run) · SAT ruck / long run · SUN off + study (unchanged)
// Legs get hit on the same days as the hard runs, so the easy days stay easy.
// These days log under their own keys (`-r`), so anything logged on the old layout stays where it was.
const RMX_ROUNDS = { 4: 3, 5: 4, 6: 2, 7: 2, 8: 3, 9: 4, 10: 4, 11: 2, 12: 4, 13: 2, 14: 3, 15: 1 };
function rmxRest(w) { return w <= 7 ? '90 SEC' : w <= 11 ? '75 SEC' : '60 SEC'; }
function rmxItems(rows) { return rows.map(function(x){ return { name: x[0], detail: x[1] }; }); }
const RMX_LOAD = 'Light: pick a weight you could do ~25 times, stop at the reps listed. Move station to station; rest only after the round.';

function rmxUpper(w, rounds) {
  const a = w % 2 === 0, pu = rgrPct('chins', 0.5, '4');
  const rows = a ? [
    ['DB BENCH PRESS', '15'],
    ['PULL-UPS (DEAD HANG)', pu],
    ['DB PUSH PRESS', '12'],
    ['ONE-ARM DB ROW', '12 ea'],
    ['DIPS', '12-15 · bench dips if the bars are taken'],
    ['FARMER CARRY', '50m · 2x50'],
  ] : [
    ['INCLINE DB PRESS', '15'],
    ['INVERTED ROW', '12-15 · bar in the rack at hip height, or TRX'],
    ['DB ARNOLD PRESS', '12'],
    ['CHIN-UPS', pu],
    ['FACE PULLS', '20 · band or cable · shoulders for the ruck'],
    ['SUITCASE CARRY', '50m ea · one heavy DB, don\'t lean'],
  ];
  const finisher = rounds >= 3 ? (a ? ' Finisher: 50 hand-release push-ups for time, any sets.' : ' Finisher: 3 x 30 sec dead hang (grip for pull-ups and the ruck).') : '';
  return { label: 'upper circuit ' + (a ? 'a — push / pull' : 'b — shoulders / back / carry'),
    title: rounds + ' ROUND' + (rounds > 1 ? 'S' : '') + ' · REST ' + rmxRest(w) + ' AFTER EACH ROUND',
    items: rmxItems(rows), note: RMX_LOAD + finisher };
}
function rmxLower(w, rounds) {
  const a = w % 2 === 0;
  const rows = a ? [
    ['GOBLET SQUAT', '15 · KB or DB'],
    ['WALKING LUNGES', '20 steps · bodyweight'],
    ['KB SWINGS', '20 · snap the hips, arms just hold on'],
    ['SINGLE-LEG RDL', '10 ea · light DB'],
    ['CALF RAISES', '20 · slow, full stretch · shins and Achilles for the miles'],
  ] : [
    ['STEP-UPS', '10 ea · knee-height box'],
    ['DB REVERSE LUNGE', '10 ea · easier on the knees than forward'],
    ['KB SWINGS', '20'],
    ['NORDIC NEGATIVES', '5 · lower as slow as you can · hamstrings for sprinting'],
    ['COPENHAGEN PLANK', '20 sec ea · inner thigh, groin insurance for the track'],
  ];
  return { label: 'lower circuit ' + (a ? 'a' : 'b') + ' — light, after the run',
    title: rounds + ' ROUND' + (rounds > 1 ? 'S' : '') + ' · REST ' + rmxRest(w) + ' AFTER EACH ROUND',
    items: rmxItems(rows), note: RMX_LOAD + ' Your legs already ran today: smooth reps, nothing to failure.' };
}
// Thursday at home: three formats in turn, so it doesn't go stale
function rmxHome(w, light) {
  if (light) return { label: 'home — easy emom', title: 'EMOM 12 MIN · EASY',
    items: rmxItems([['MIN 1 · KB SWINGS', '12'], ['MIN 2 · PUSH-UPS', '10'], ['MIN 3 · GOBLET SQUAT', '10 · 35 KB'], ['MIN 4 · DEAD BUGS', '8 ea']]),
    note: 'Three rounds. Move, breathe, done.' };
  const r = RMX_ROUNDS[w], f = w % 3;
  if (f === 0) return { label: 'home — emom (every minute on the minute)', title: 'EMOM ' + (r * 4 + 4) + ' MIN · ' + (r + 1) + ' ROUNDS',
    items: rmxItems([['MIN 1 · KB SWINGS', '15 · 35 KB'], ['MIN 2 · HAND-RELEASE PUSH-UPS', '12-15'], ['MIN 3 · GOBLET SQUAT', '12 · 35 KB'], ['MIN 4 · SAND BALL SLAMS', '10 · 10 lb ball, squat to pick it up']]),
    note: 'Start each station at the top of the minute; the rest of the minute is your rest. Missing the minute = drop 2 reps next round.' };
  if (f === 1) return { label: 'home — amrap (as many rounds as possible)', title: 'AMRAP ' + (r * 4 + 4) + ' MIN · LOG ROUNDS',
    items: rmxItems([['KB CLEAN + PRESS', '5 ea'], ['BURPEES', '8 · step back if your feet are beat'], ['SAND BALL GROUND-TO-SHOULDER', '10 · alternate shoulders'], ['MOUNTAIN CLIMBERS', '20 · count each leg']]),
    note: 'Steady pace you could hold all the way through. Log the rounds, and next time beat it by one.' };
  return { label: 'home — ladder', title: '10→1 LADDER · THEN ' + Math.max(2, r - 1) + ' CORE ROUNDS',
    items: rmxItems([['KB SWINGS + PUSH-UPS', '10 + 10, 9 + 9 … 1 + 1 (55 of each)'], ['SAND BALL RUSSIAN TWISTS', '20 · core round'], ['HOLLOW HOLD', '30 sec · core round'], ['KB HALOS', '8 ea way · core round']]),
    note: 'Ladder for time — log it. Then the three core moves as rounds, 45 sec rest.' };
}

function rgrRemix(w, d) {
  if (w < 4) return;
  const wk = RGR_WEEKS[w - 1], deload = wk.type === 'DELOAD', holiday = !!RGR_HOLIDAY[w];
  const r = RMX_ROUNDS[w], p = rgrPaces();
  const where = holiday ? 'SOLO' : 'TRACK';
  const gymNote = holiday ? ' School closed? Do Thursday\'s home circuit instead.' : '';

  if (w >= 5) {
    // MONDAY — the hard run, then upper body in the weight room
    let run;
    if (w === 6) {
      run = { title: '2-MILE TIME TRIAL', steps: [
        '10 min easy + drills + 3 x 20 sec strides',
        '2 MILES (8 laps) all-out but even' + (p ? ' — lap 1 at about ' + fmtMMSS(p.goalMi / 4) + ', not faster' : ' — lap 1 no faster than the rest'),
        'Log it in YOUR NUMBERS — every pace for weeks 8–15 comes from it.',
        '10 min walk/jog cool-down'] };
    } else if (w === 15) {
      run = { title: 'EASY RUN — 20 MIN + STRIDES', steps: ['20 min easy. ' + rgrEasy(), '4 x 20 sec strides — just touch speed', 'Last track day before you ship.'] };
    } else {
      const iv = RGR_INTERVALS[w];
      const steps = ['10 min easy + drills (A-skips, high knees), 3 x 20 sec strides',
        iv.reps + ' x ' + iv.label + ' ' + rgrRepPace(iv.m, iv.fast) + ' — rest ' + iv.rest];
      if (iv.note && !/Hotel/.test(iv.note)) steps.push(iv.note);
      steps.push('10 min easy cool-down');
      run = { title: 'INTERVALS — ' + iv.reps + ' x ' + iv.label, steps: steps };
    }
    const testWk = w === 6 || w === 13 || w === 15;
    d.monday = { day: 'MONDAY', focus: where + ' + UPPER', time: w === 15 ? '~40 MIN' : '~80 MIN', v2: true, runFirst: true, run: run,
      liftLabel: 'weight room — after the track',
      lifts: [{ name: 'PLANK (FIRST IN THE WEIGHT ROOM)', note: 'AFT form, before the push-ups tire your shoulders.', sets: testWk ? '1' : '3',
        reps: testWk ? '1:00' : rgrPlank(0.6, w), lbs: 'BW', rest: '60 SEC' }],
      circuits: [rmxUpper(w, r)],
      fuel: RGR_FUEL,
      pm: (w === 6 ? 'Test day: run it with the team, then a light upper circuit — 2 rounds, easy.' : holiday ? 'No team practice — solo at the track.' : 'Run your reps; the kids run theirs. Then the weight room.') + gymNote };

    // TUESDAY — optional, easy
    if (holiday || w === 13 || w === 15) {
      d.tuesday = { day: 'TUESDAY', focus: 'OFF', time: 'OPTIONAL', v2: true,
        recovery: ['Off. ' + (w === 13 ? 'Mock AFT Saturday — bank the rest.' : w === 15 ? 'Ship week — bank the rest.' : 'No team practice this week.'), 'Optional: 20-30 min walk', '10 min mobility: hips, calves, feet'] };
    } else {
      d.tuesday = { day: 'TUESDAY', focus: 'OPTIONAL · EASY', time: '~35 MIN', v2: true,
        run: { title: 'EASY RUN WITH THE KIDS — 20-30 MIN (OPTIONAL)', steps: [
          'Only if Monday\'s legs feel fine — shins, knees and feet 3/10 or better. Otherwise rest; that\'s the plan, not a skip.',
          rgrEasy() + ' Time, not distance.',
          'Run with them, not against them. No strides.'] },
        core: [
          { name: 'PULL-UPS', detail: '4 x ' + rgrPct('chins', 0.5, '3') + ' — spread through practice' },
          { name: 'HAND-RELEASE PUSH-UPS', detail: '3 x 15 — crisp' },
        ] };
    }
  }

  // WEDNESDAY — track (tempo or easy), then trap bar + lower circuit + SDC
  const tempo = w === 4 ? null : RGR_TEMPO[w], easy = w === 4 ? 25 : RGR_EASY_MIN[w];
  const wrun = tempo ? { title: 'TEMPO — ' + tempo + ' MIN', steps: [
      '10 min easy + 4 x 20 sec strides',
      tempo + ' min steady' + (p ? ' at ' + fmtMMSS(p.tempoMi) + '/mi' : '') + ' — comfortably hard: you could say a sentence, not a paragraph.',
      '10 min easy cool-down'] }
    : { title: 'EASY RUN — ' + easy + ' MIN', steps: [easy + ' min easy. ' + rgrEasy() + ' Time, not distance.',
      w === 4 ? 'Easy today — you ran intervals yesterday.' : w === 15 ? '4 x 200m relaxed, 2 min walk — just touch speed.' : 'Finish with 4 x 20 sec strides'] };
  if (w === 6) {
    d.wednesday = { day: 'WEDNESDAY', focus: 'CHECKPOINT — PLANK + SDC', time: '~60 MIN', v2: true, runFirst: true,
      run: { title: 'EASY RUN — 20 MIN', steps: ['20 min easy with the team. ' + rgrEasy(), 'Then plank, then SDC.'] },
      liftLabel: 'test',
      lifts: [{ name: 'PLANK — MAX', note: 'AFT form: forearms down, straight line, hold until the form breaks. Log it.', sets: '1', reps: 'MAX', lbs: 'BW', rest: '10 MIN' }],
      sdc: { title: 'SPRINT-DRAG-CARRY — 1 ROUND FOR TIME', items: RGR_SDC, note: 'Full effort. Log it in YOUR NUMBERS.' } };
  } else if (w === 13 || w === 15) {
    d.wednesday = { day: 'WEDNESDAY', focus: w === 13 ? 'LIGHT — MOCK WEEK' : 'TAPER', time: '~35 MIN', v2: true, runFirst: true, run: wrun,
      liftLabel: 'weight room — just move',
      lifts: [{ name: 'GOBLET SQUAT', note: 'Light — just move.', sets: '2', reps: '8', lbs: '50' },
              { name: 'PLANK', note: 'Easy.', sets: '2', reps: '1:00', lbs: 'BW' }],
      sdc: w === 13 ? { title: 'SDC — 1 WALK-THROUGH ROUND', items: RGR_SDC, note: 'Practice the turns at 70%. No racing — Saturday counts.' } : null };
  } else {
    const sdcTitle = RGR_SDC_PLAN[w];
    const dl = deload ? '315' : w === 12 ? '340' : '315-340';
    d.wednesday = { day: 'WEDNESDAY', focus: where + ' + LOWER', time: '~85 MIN', v2: true, runFirst: true, run: wrun,
      liftLabel: 'weight room — the one heavy thing, then the circuit',
      lifts: [
        { name: 'TRAP BAR DEADLIFT', aft: true, note: 'The only heavy lift left — it keeps the AFT max. Ramp: 135×5, 225×3, 275×2, then work sets. Cap 340: the AFT stops scoring there.', sets: '2', reps: '3', lbs: dl, rest: '2-3 MIN' },
        { name: 'WEIGHTED PLANK', note: 'Plate on your upper back, AFT form. Makes the bodyweight plank feel light.', sets: deload ? '2' : '3', reps: '45 SEC', lbs: w <= 5 ? '25' : w <= 10 ? '35' : '45', rest: '60 SEC' },
      ],
      circuits: [rmxLower(w, sdcTitle && r > 2 ? r - 1 : r)],
      sdc: sdcTitle ? { title: sdcTitle, items: RGR_SDC, note: 'After the circuit. No sled? A 45 lb plate on a towel or rope works.' }
        : { title: 'ACCELERATION — SDC BUILDING BLOCKS', items: RGR_ACCEL, note: 'The SDC is won in the starts and the turns, not top speed.' },
      fuel: RGR_FUEL,
      pm: (holiday ? 'No team practice — solo.' : 'Run with the team first, then the weight room.') + gymNote };
  }

  // THURSDAY — home circuit + the long plank (Future Soldier is classroom)
  if (w === 13 || w === 15) {
    d.thursday = { day: 'THURSDAY', focus: 'OFF · MOBILITY', time: '20 MIN', v2: true,
      recovery: [w === 13 ? 'Mock AFT is Saturday. Nothing hard.' : 'You ship Monday. Nothing hard.', '20 min mobility: hips, calves, feet, thoracic spine', 'Plank 1 x 1:00 — easy', 'Future Soldier class as normal.'] };
  } else {
    const light = deload || w === 6;
    d.thursday = { day: 'THURSDAY', focus: 'HOME CIRCUIT', time: light ? '~20 MIN' : '~35 MIN', v2: true,
      circuits: [rmxHome(w, light)],
      core: [{ name: 'PLANK', detail: light ? '1 x 1:00 — easy' : '2 x ' + rgrPlank(0.8, w) + ' — rest 2 min. The long hold.' }],
      pm: 'Future Soldier class is today — do this before or after, at home. Short warm-up first: 2 min jumping jacks, 10 KB halos, 10 bodyweight squats.' };
  }
}

// ── Ship Prep rendering ──
function rgrList(items, prefix, kind, title, noLog) {
  let h = '<div class="lt-tracker"><div class="lt-tracker-title">' + title + '</div><div class="lt-sets">';
  items.forEach(function(c, i) {
    const key = prefix + '-' + kind + '-' + i;
    h += '<div class="lt-set"><div class="lt-set-label">' + (i + 1) + '. ' + c.name + '</div>'
      + '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">'
      + (c.detail ? '<div class="lt-set-detail">' + c.detail + '</div>' : '')
      + (noLog ? '' : '<input class="actual-input" placeholder="—" value="' + (actualLog[key] || '') + '" oninput="saveActual(\'' + key + '\', this)">')
      + '<div class="done-check ' + (checkedState[key] ? 'checked' : '') + '" id="check-' + key + '" onclick="toggleCheck(\'' + key + '\')">' + (checkedState[key] ? '✓' : '') + '</div>'
      + '</div></div>';
  });
  return h + '</div></div>';
}
function rgrRunCard(run, prefix) {
  const key = prefix + '-run';
  return '<div class="run-card"><div class="run-card-title">' + run.title + '</div><div class="run-intervals">'
    + run.steps.map(function(s, i) {
        return '<div class="run-interval"><div class="run-interval-num">0' + (i + 1) + '</div><div class="run-interval-desc">' + s + '</div></div>';
      }).join('')
    + '<div class="run-interval"><div class="run-interval-num">⏱</div><div class="run-interval-desc" style="color:var(--text-dim)">LOG — time / splits / how it felt</div>'
    + '<input class="actual-input" style="width:120px" placeholder="—" value="' + (actualLog[key] || '') + '" oninput="saveActual(\'' + key + '\', this)">'
    + '<div class="done-check ' + (checkedState[key] ? 'checked' : '') + '" id="check-' + key + '" onclick="toggleCheck(\'' + key + '\')">' + (checkedState[key] ? '✓' : '') + '</div></div>'
    + '</div></div>';
}
function rgrNumbersCard() {
  const p = rgrPaces();
